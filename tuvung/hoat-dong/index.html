<script>var tvWords=[{"label":"หวีผม - Chải tóc","url":"https://hoctiengthai.github.io/Poltv/tuvung/hoat-dong/chai-toc/"},{"label":"ทำอาหาร - Nấu ăn","url":"https://hoctiengthai.github.io/Poltv/tuvung/hoat-dong/nau-an/"}];(function(){var input=document.getElementById("wordSearch");var suggestBox=document.getElementById("wordSuggest");input.addEventListener("input",function(){var q=input.value.trim().toLowerCase();suggestBox.innerHTML="";if(!q){suggestBox.style.display="none";return;}var matches=tvWords.filter(function(it){return it.label.toLowerCase().indexOf(q)===0;});if(matches.length===0){suggestBox.style.display="none";return;}matches.forEach(function(it){var el=document.createElement("div");el.className="suggest-item";el.textContent=it.label;el.addEventListener("click",function(){window.top.location.href=it.url;});suggestBox.appendChild(el);});suggestBox.style.display="block";});document.addEventListener("click",function(e){if(e.target!==input&&!suggestBox.contains(e.target)){suggestBox.style.display="none";}});})();</script>
