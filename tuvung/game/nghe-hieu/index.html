<script>var tvCurrentAudio=null;var tvCurrentBtn=null;function tvSetLoadingLabel(active){var el=document.getElementById("tvLoadingLabel");if(el)el.classList.toggle("active",active);}function tvPlayAudio(url,btnEl){pmGateOrRun(function(){tvPlayAudioReal(url,btnEl);});}function tvPlayAudioReal(url,btnEl){if(!url)return;if(tvCurrentBtn===btnEl){if(tvCurrentAudio){tvCurrentAudio.pause();}btnEl.classList.remove("playing","loading");tvSetLoadingLabel(false);tvCurrentBtn=null;tvCurrentAudio=null;return;}if(tvCurrentAudio){tvCurrentAudio.pause();}if(tvCurrentBtn)tvCurrentBtn.classList.remove("playing","loading");tvCurrentBtn=btnEl;btnEl.classList.add("loading");tvSetLoadingLabel(true);var audio=new Audio(url);tvCurrentAudio=audio;var onReady=function(){if(tvCurrentAudio!==audio)return;btnEl.classList.remove("loading");btnEl.classList.add("playing");tvSetLoadingLabel(false);};var onFail=function(){if(tvCurrentAudio!==audio)return;btnEl.classList.remove("loading","playing");tvSetLoadingLabel(false);if(tvCurrentBtn===btnEl)tvCurrentBtn=null;};audio.addEventListener("canplaythrough",onReady,{once:true});audio.addEventListener("error",onFail);audio.addEventListener("ended",function(){btnEl.classList.remove("playing");if(tvCurrentBtn===btnEl)tvCurrentBtn=null;});audio.play().then(onReady).catch(onFail);}var pmUnlocked=false;var pmGateCbCount=0;function pmGateJsonp(action,params){return new Promise(function(resolve){pmGateCbCount++;var cbName="pmGateCb"+Date.now()+"_"+pmGateCbCount;var u=new URL("https://script.google.com/macros/s/AKfycbx0zDBbIOZRRmKoqdh3GCEVyvi07vCZL9z2i3yOfC0yZ9G6tbmqnFuLz1c1MfqP7yG5/exec");u.searchParams.set("action",action);if(params){Object.keys(params).forEach(function(k){u.searchParams.set(k,params[k]);});}u.searchParams.set("callback",cbName);var s=document.createElement("script");var done=false;var cleanup=function(){delete window[cbName];if(s.parentNode)s.parentNode.removeChild(s);clearTimeout(t);};window[cbName]=function(d){done=true;cleanup();resolve(d);};s.onerror=function(){if(done)return;cleanup();resolve({ok:false});};var t=setTimeout(function(){if(done)return;cleanup();resolve({ok:false});},15000);s.src=u.toString();document.head.appendChild(s);});}function pmSetUnlocked(v){pmUnlocked=v;document.body.classList.toggle("pm-unlocked",v);}function pmOpenModal(){document.getElementById("pmModalOverlay").classList.add("show");}function pmCloseModal(){document.getElementById("pmModalOverlay").classList.remove("show");}function pmUnlock(){var input=document.getElementById("pmModalEmailInput");var btn=document.getElementById("pmModalBtn");var errEl=document.getElementById("pmModalError");var email=input.value.trim();if(!email){errEl.innerHTML="Vui lòng nhập email.";return;}btn.disabled=true;btn.textContent="Đang kiểm tra...";errEl.innerHTML="";pmGateJsonp("kiemTraQuyenXem",{email:email}).then(function(res){btn.disabled=false;btn.textContent="Mở khoá";if(res&&res.ok&&res.active){localStorage.setItem("poltv_email",email);pmSetUnlocked(true);pmCloseModal();}else if(res&&res.ok){errEl.innerHTML="Email chưa kích hoạt hoặc đã hết hạn. <a href=\"https://poltv.vn/dangky/\" target=\"_blank\">Đăng ký / gia hạn ngay</a>";}else{errEl.innerHTML="Không kiểm tra được lúc này (có thể do mạng yếu). Vui lòng thử lại.";}});}function pmGateOrRun(fn){if(pmUnlocked){fn();}else{pmOpenModal();}}(function(){var saved=localStorage.getItem("poltv_email");if(!saved)return;pmSetUnlocked(true);pmGateJsonp("kiemTraQuyenXem",{email:saved}).then(function(res){if(res&&res.ok&&!res.active){localStorage.removeItem("poltv_email");pmSetUnlocked(false);}});})();</script>
<script>var TVG_MODE="nghe-hieu";var TVG_GAME_MENU_URL="https://poltv.vn/tuvung/game/";var tvgIconLoaUrl="https://drive.google.com/thumbnail?id=1flcELd6MIr6ssokoIKK_2dcuujw_uZeL&sz=w80";var TVG_MODE_CONFIG={"doc-hieu":{promptType:"thai",answerType:"choice",poolFilter:function(it){return true;}},"nghe-hieu":{promptType:"audio",answerType:"choice",poolFilter:function(it){return !!it.audioUrl;}},"viet-dung":{promptType:"audio",answerType:"text",poolFilter:function(it){return it.loai==="tu"&&!!it.audioUrl;}}};var TVG_ROUND_SIZE=10;var tvgPool=[];var tvgRound=[];var tvgIndex=0;var tvgScore=0;var tvgTally=[];var tvgLastRoundKeys=null;var tvgCurrentItem=null;var tvgAnsweredWrongOnce=false;function tvgEsc(s){var d=document.createElement("div");d.textContent=(s===null||s===undefined)?"":String(s);return d.innerHTML;}function tvgShuffle(arr){for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}function tvgKeyFor(item){return item.loai+"|"+item.thai;}function tvgSameSet(candItems,lastKeys){if(!lastKeys)return false;var candKeys=candItems.map(tvgKeyFor).slice().sort();var prev=lastKeys.slice().sort();if(candKeys.length!==prev.length)return false;for(var i=0;i<candKeys.length;i++){if(candKeys[i]!==prev[i])return false;}return true;}function tvgInit(){fetch("/tuvung/game-data.json").then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.json();}).then(function(data){var cfg=TVG_MODE_CONFIG[TVG_MODE];tvgPool=(data.items||[]).filter(cfg.poolFilter);if(tvgPool.length===0){tvgShowEmptyPool();return;}tvgStartRound();}).catch(function(){tvgShowFetchError();});}function tvgStartRound(){var cfg=TVG_MODE_CONFIG[TVG_MODE];var usablePool=tvgPool;if(cfg.answerType==="choice"){usablePool=tvgPool.filter(function(it){return tvgPool.some(function(o){return o.viet&&o.viet!==it.viet;});});if(usablePool.length===0){tvgShowEmptyPool();return;}}var n=Math.min(TVG_ROUND_SIZE,usablePool.length);var candidate,attempt=0;do{candidate=tvgShuffle(usablePool.slice()).slice(0,n);attempt++;}while(usablePool.length>n&&attempt<20&&tvgSameSet(candidate,tvgLastRoundKeys));tvgRound=candidate;tvgLastRoundKeys=candidate.map(tvgKeyFor);tvgIndex=0;tvgScore=0;tvgTally=[];tvgRenderQuestion();}function tvgPickDistractors(correctItem,count){var pool=tvgPool.filter(function(it){return it.viet&&it.viet!==correctItem.viet;});var shuffled=tvgShuffle(pool.slice());var out=[];var seen={};seen[correctItem.viet]=true;for(var i=0;i<shuffled.length&&out.length<count;i++){if(!seen[shuffled[i].viet]){seen[shuffled[i].viet]=true;out.push(shuffled[i].viet);}}return out;}function tvgUpdateProgress(){document.getElementById("tvgProgressText").textContent="Câu "+(tvgIndex+1)+"/"+tvgRound.length;document.getElementById("tvgScoreText").textContent="Điểm: "+tvgScore;}function tvgRenderQuestion(){tvgCurrentItem=tvgRound[tvgIndex];tvgAnsweredWrongOnce=false;tvgUpdateProgress();var cfg=TVG_MODE_CONFIG[TVG_MODE];var area=document.getElementById("tvgGameArea");var html="";if(cfg.promptType==="thai"){html+='<div class="tvg-prompt-card"><div class="tvg-prompt-thai">'+tvgEsc(tvgCurrentItem.thai)+'</div></div>';}else{html+='<div class="tvg-prompt-card"><img class="loa-icon tvg-loa-big pm-media-trigger" src="'+tvgEsc(tvgIconLoaUrl)+'" alt="Phát âm" onclick="tvPlayAudio(&apos;'+tvgEsc(tvgCurrentItem.audioUrl)+'&apos;,this)"></div>';html+='<div class="tvg-loading-label" id="tvLoadingLabel">Đang tải âm thanh...</div>';}if(cfg.answerType==="choice"){var distractors=tvgPickDistractors(tvgCurrentItem,3);var choices=tvgShuffle([tvgCurrentItem.viet].concat(distractors));html+='<div class="tvg-choices">';choices.forEach(function(c){var isCorrect=(c===tvgCurrentItem.viet);html+='<button type="button" class="tvg-choice" onclick="tvgHandleChoice(this,'+isCorrect+')">'+tvgEsc(c)+'</button>';});html+='</div>';}else{html+='<div class="tvg-input-wrap">'+'<input type="text" class="tvg-text-input" id="tvgTextInput" placeholder="Gõ tiếng Thái bạn nghe được...">'+'<button type="button" class="tvg-submit-btn" id="tvgSubmitBtn" onclick="tvgHandleTextSubmit()">Kiểm tra</button>'+'<div class="tvg-text-feedback" id="tvgTextFeedback"></div>'+'</div>';}area.innerHTML=html;if(cfg.answerType==="text"){document.getElementById("tvgTextInput").addEventListener("keydown",function(e){if(e.key==="Enter")tvgHandleTextSubmit();});}}function tvgDisableAllChoices(){var btns=document.querySelectorAll(".tvg-choice");for(var i=0;i<btns.length;i++){btns[i].disabled=true;}}function tvgHandleChoice(btnEl,isCorrect){if(btnEl.disabled)return;if(isCorrect){btnEl.classList.add("correct");if(!tvgAnsweredWrongOnce){tvgScore+=10;tvgTally.push({correct:true});}else{tvgTally.push({correct:false});}tvgUpdateProgress();tvgDisableAllChoices();setTimeout(tvgAdvanceAfterAudio,1200);}else{btnEl.classList.add("wrong");btnEl.disabled=true;tvgAnsweredWrongOnce=true;}}function tvgBasicNormalize(str){return (str||"").trim().replace(/\s+/g," ").normalize("NFC");}function tvgToThaiDigits(str){var map={"0":"\u0E50","1":"\u0E51","2":"\u0E52","3":"\u0E53","4":"\u0E54","5":"\u0E55","6":"\u0E56","7":"\u0E57","8":"\u0E58","9":"\u0E59"};return str.replace(/[0-9]/g,function(d){return map[d];});}function tvgParseHintGroup(rawThai){var m=/\(([^()]*)\)/.exec(rawThai);if(!m)return null;var content=m[1];var before=tvgBasicNormalize(rawThai.slice(0,m.index));var trimmedNoSpace=content.replace(/\s+/g,"");if(trimmedNoSpace.length===0)return null;if(trimmedNoSpace.indexOf(".")!==-1&&/^[\u0E01-\u0E2E.]+$/.test(trimmedNoSpace)){return{type:"abbrev",before:before,abbrev:tvgBasicNormalize(content)};}if(/^[0-9]+$/.test(trimmedNoSpace)){return{type:"number",before:before,digits:trimmedNoSpace};}return null;}function tvgBuildAcceptableAnswers(rawThai){var raw=tvgBasicNormalize(rawThai);var hint=tvgParseHintGroup(rawThai);if(!hint)return[raw];if(hint.type==="abbrev"){var list=[raw,hint.before,hint.abbrev];if(hint.before.indexOf("\u0E1B\u0E35")===0){list.push(tvgBasicNormalize("\u0E1B\u0E35 "+hint.abbrev));}return list;}if(hint.type==="number"){return[raw,hint.before,hint.digits,tvgToThaiDigits(hint.digits)];}return[raw];}function tvgHandleTextSubmit(){var inputEl=document.getElementById("tvgTextInput");var raw=inputEl.value;var normalized=tvgBasicNormalize(raw);var feedbackEl=document.getElementById("tvgTextFeedback");if(tvgBuildAcceptableAnswers(tvgCurrentItem.thai).indexOf(normalized)!==-1){feedbackEl.textContent="✅ Đúng!";if(!tvgAnsweredWrongOnce){tvgScore+=10;tvgTally.push({correct:true});}else{tvgTally.push({correct:false});}tvgUpdateProgress();inputEl.disabled=true;document.getElementById("tvgSubmitBtn").disabled=true;setTimeout(tvgAdvanceAfterAudio,1200);}else{feedbackEl.textContent="❌ Chưa đúng, thử lại.";tvgAnsweredWrongOnce=true;}}function tvgAdvance(){tvgIndex++;if(tvgIndex>=tvgRound.length){tvgShowSummary();}else{tvgRenderQuestion();}}function tvgAdvanceAfterAudio(){if(typeof tvCurrentAudio!=="undefined"&&tvCurrentAudio&&!tvCurrentAudio.paused&&!tvCurrentAudio.ended){var daXong=false;var xongThi=function(){if(daXong)return;daXong=true;tvCurrentAudio.removeEventListener("ended",xongThi);tvgAdvance();};tvCurrentAudio.addEventListener("ended",xongThi);setTimeout(xongThi,8000);}else{tvgAdvance();}}function tvgShowSummary(){var maxScore=tvgRound.length*10;var correctCount=tvgTally.filter(function(t){return t.correct;}).length;document.getElementById("tvgProgressText").textContent="Đã xong";var area=document.getElementById("tvgGameArea");area.innerHTML='<div class="tvg-summary">'+'<div>Điểm của bạn</div>'+'<div class="tvg-score">'+tvgScore+'/'+maxScore+'</div>'+'<div class="tvg-tally">Đúng '+correctCount+'/'+tvgRound.length+' câu</div>'+'<div class="tvg-summary-actions">'+'<button type="button" class="tvg-btn tvg-btn-primary" onclick="tvgStartRound()">🔁 Chơi tiếp</button>'+'</div></div>';}function tvgShowEmptyPool(){document.getElementById("tvgGameArea").innerHTML='<div class="tvg-state-msg">Chưa đủ dữ liệu để chơi chế độ này, quay lại sau nhé.<br><br><a href="'+TVG_GAME_MENU_URL+'">⬅️ Quay lại</a></div>';}function tvgShowFetchError(){document.getElementById("tvgGameArea").innerHTML='<div class="tvg-state-msg">Không tải được dữ liệu trò chơi, vui lòng thử lại.<br><br><a href="javascript:location.reload()">🔄 Tải lại</a></div>';}document.addEventListener("DOMContentLoaded",tvgInit);</script>
