<body>
<div class="page" role="main">
<div class="banner-wrap"><img src="https://poltv.vn/assets/interface/banner.webp" alt="POLTV Banner"><div class="banner-title-overlay"><h1 class="topic-title-thai">Đọc hiểu</h1></div></div>
<div class="tvg-wrap"><div class="tvg-progress"><span id="tvgProgressText">Câu 1/10</span><span id="tvgScoreText">Điểm: 0</span></div><div id="tvgGameArea"><div class="tvg-state-msg">Đang tải câu hỏi...</div></div></div>
<a class="back-button-wrap" href="https://poltv.vn/tuvung/game/"><div class="back-button-inner"><img src="https://poltv.vn/assets/interface/back-button.png" alt="Quay lại"><span class="back-button-text">Quay lại</span></div></a>
</div>
<script>var TVG_MODE="doc-hieu";var TVG_GAME_MENU_URL="https://poltv.vn/tuvung/game/";var tvgIconLoaUrl="https://drive.google.com/thumbnail?id=1flcELd6MIr6ssokoIKK_2dcuujw_uZeL&sz=w80";var TVG_MODE_CONFIG={"doc-hieu":{promptType:"thai",answerType:"choice",poolFilter:function(it){return true;}},"nghe-hieu":{promptType:"audio",answerType:"choice",poolFilter:function(it){return !!it.audioUrl;}},"viet-dung":{promptType:"audio",answerType:"text",poolFilter:function(it){return it.loai==="tu"&&!!it.audioUrl;}}};var TVG_ROUND_SIZE=10;var tvgPool=[];var tvgRound=[];var tvgIndex=0;var tvgScore=0;var tvgTally=[];var tvgLastRoundKeys=null;var tvgCurrentItem=null;var tvgAnsweredWrongOnce=false;function tvgEsc(s){var d=document.createElement("div");d.textContent=(s===null||s===undefined)?"":String(s);return d.innerHTML;}function tvgShuffle(arr){for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}function tvgKeyFor(item){return item.loai+"|"+item.thai;}function tvgSameSet(candItems,lastKeys){if(!lastKeys)return false;var candKeys=candItems.map(tvgKeyFor).slice().sort();var prev=lastKeys.slice().sort();if(candKeys.length!==prev.length)return false;for(var i=0;i<candKeys.length;i++){if(candKeys[i]!==prev[i])return false;}return true;}function tvgInit(){fetch("/tuvung/game-data.json").then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.json();}).then(function(data){var cfg=TVG_MODE_CONFIG[TVG_MODE];tvgPool=(data.items||[]).filter(cfg.poolFilter);if(tvgPool.length===0){tvgShowEmptyPool();return;}tvgStartRound();}).catch(function(){tvgShowFetchError();});}function tvgStartRound(){var cfg=TVG_MODE_CONFIG[TVG_MODE];var usablePool=tvgPool;if(cfg.answerType==="choice"){usablePool=tvgPool.filter(function(it){return tvgPool.some(function(o){return o.viet&&o.viet!==it.viet;});});if(usablePool.length===0){tvgShowEmptyPool();return;}}var n=Math.min(TVG_ROUND_SIZE,usablePool.length);var candidate,attempt=0;do{candidate=tvgShuffle(usablePool.slice()).slice(0,n);attempt++;}while(usablePool.length>n&&attempt<20&&tvgSameSet(candidate,tvgLastRoundKeys));tvgRound=candidate;tvgLastRoundKeys=candidate.map(tvgKeyFor);tvgIndex=0;tvgScore=0;tvgTally=[];tvgRenderQuestion();}function tvgPickDistractors(correctItem,count){var pool=tvgPool.filter(function(it){return it.viet&&it.viet!==correctItem.viet;});var shuffled=tvgShuffle(pool.slice());var out=[];var seen={};seen[correctItem.viet]=true;for(var i=0;i<shuffled.length&&out.length<count;i++){if(!seen[shuffled[i].viet]){seen[shuffled[i].viet]=true;out.push(shuffled[i].viet);}}return out;}function tvgUpdateProgress(){document.getElementById("tvgProgressText").textContent="Câu "+(tvgIndex+1)+"/"+tvgRound.length;document.getElementById("tvgScoreText").textContent="Điểm: "+tvgScore;}function tvgRenderQuestion(){tvgCurrentItem=tvgRound[tvgIndex];tvgAnsweredWrongOnce=false;tvgUpdateProgress();var cfg=TVG_MODE_CONFIG[TVG_MODE];var area=document.getElementById("tvgGameArea");var html="";if(cfg.promptType==="thai"){html+='<div class="tvg-prompt-card"><div class="tvg-prompt-thai">'+tvgEsc(tvgCurrentItem.thai)+'</div></div>';}else{html+='<div class="tvg-prompt-card"><img class="loa-icon tvg-loa-big pm-media-trigger" src="'+tvgEsc(tvgIconLoaUrl)+'" alt="Phát âm" onclick="tvPlayAudio(&apos;'+tvgEsc(tvgCurrentItem.audioUrl)+'&apos;,this)"></div>';html+='<div class="tvg-loading-label" id="tvLoadingLabel">Đang tải âm thanh...</div>';}if(cfg.answerType==="choice"){var distractors=tvgPickDistractors(tvgCurrentItem,3);var choices=tvgShuffle([tvgCurrentItem.viet].concat(distractors));html+='<div class="tvg-choices">';choices.forEach(function(c){var isCorrect=(c===tvgCurrentItem.viet);html+='<button type="button" class="tvg-choice" onclick="tvgHandleChoice(this,'+isCorrect+')">'+tvgEsc(c)+'</button>';});html+='</div>';}else{html+='<div class="tvg-input-wrap">'+'<input type="text" class="tvg-text-input" id="tvgTextInput" placeholder="Gõ tiếng Thái bạn nghe được...">'+'<button type="button" class="tvg-submit-btn" id="tvgSubmitBtn" onclick="tvgHandleTextSubmit()">Kiểm tra</button>'+'<div class="tvg-text-feedback" id="tvgTextFeedback"></div>'+'</div>';}area.innerHTML=html;if(cfg.answerType==="text"){document.getElementById("tvgTextInput").addEventListener("keydown",function(e){if(e.key==="Enter")tvgHandleTextSubmit();});}}function tvgDisableAllChoices(){var btns=document.querySelectorAll(".tvg-choice");for(var i=0;i<btns.length;i++){btns[i].disabled=true;}}function tvgHandleChoice(btnEl,isCorrect){if(btnEl.disabled)return;if(isCorrect){btnEl.classList.add("correct");if(!tvgAnsweredWrongOnce){tvgScore+=10;tvgTally.push({correct:true});}else{tvgTally.push({correct:false});}tvgUpdateProgress();tvgDisableAllChoices();setTimeout(tvgAdvanceAfterAudio,1200);}else{btnEl.classList.add("wrong");btnEl.disabled=true;tvgAnsweredWrongOnce=true;}}function tvgHandleTextSubmit(){var inputEl=document.getElementById("tvgTextInput");var raw=inputEl.value;var normalized=raw.trim().replace(/\s+/g," ").normalize("NFC");var feedbackEl=document.getElementById("tvgTextFeedback");if(normalized===tvgCurrentItem.thai.normalize("NFC")){feedbackEl.textContent="✅ Đúng!";if(!tvgAnsweredWrongOnce){tvgScore+=10;tvgTally.push({correct:true});}else{tvgTally.push({correct:false});}tvgUpdateProgress();inputEl.disabled=true;document.getElementById("tvgSubmitBtn").disabled=true;setTimeout(tvgAdvanceAfterAudio,1200);}else{feedbackEl.textContent="❌ Chưa đúng, thử lại.";tvgAnsweredWrongOnce=true;}}function tvgAdvance(){tvgIndex++;if(tvgIndex>=tvgRound.length){tvgShowSummary();}else{tvgRenderQuestion();}}function tvgAdvanceAfterAudio(){if(typeof tvCurrentAudio!=="undefined"&&tvCurrentAudio&&!tvCurrentAudio.paused&&!tvCurrentAudio.ended){var daXong=false;var xongThi=function(){if(daXong)return;daXong=true;tvCurrentAudio.removeEventListener("ended",xongThi);tvgAdvance();};tvCurrentAudio.addEventListener("ended",xongThi);setTimeout(xongThi,8000);}else{tvgAdvance();}}function tvgShowSummary(){var maxScore=tvgRound.length*10;var correctCount=tvgTally.filter(function(t){return t.correct;}).length;document.getElementById("tvgProgressText").textContent="Đã xong";var area=document.getElementById("tvgGameArea");area.innerHTML='<div class="tvg-summary">'+'<div>Điểm của bạn</div>'+'<div class="tvg-score">'+tvgScore+'/'+maxScore+'</div>'+'<div class="tvg-tally">Đúng '+correctCount+'/'+tvgRound.length+' câu</div>'+'<div class="tvg-summary-actions">'+'<button type="button" class="tvg-btn tvg-btn-primary" onclick="tvgStartRound()">🔁 Chơi tiếp</button>'+'</div></div>';}function tvgShowEmptyPool(){document.getElementById("tvgGameArea").innerHTML='<div class="tvg-state-msg">Chưa đủ dữ liệu để chơi chế độ này, quay lại sau nhé.<br><br><a href="'+TVG_GAME_MENU_URL+'">⬅️ Quay lại</a></div>';}function tvgShowFetchError(){document.getElementById("tvgGameArea").innerHTML='<div class="tvg-state-msg">Không tải được dữ liệu trò chơi, vui lòng thử lại.<br><br><a href="javascript:location.reload()">🔄 Tải lại</a></div>';}document.addEventListener("DOMContentLoaded",tvgInit);</script>
