ocument.createElement("div");el.className="suggest-item";el.textContent=it.vi;el.addEventListener("click",function(){var u=it.url;suggestBox.style.display="none";if(u.charAt(0)==="#"&&window.poltvJumpToAnchor){var id=u.slice(1);var vv=window.visualViewport;var done=false;function jumpNow(){if(done)return;done=true;if(vv)vv.removeEventListener("resize",jumpNow);window.poltvJumpToAnchor(id);}if(vv)vv.addEventListener("resize",jumpNow);setTimeout(jumpNow,350);input.blur();}else{window.top.location.href=u;}});suggestBox.appendChild(el);});suggestBox.style.display="block";}input.addEventListener("input",tvRunSearch);input.addEventListener("focus",tvRunSearch);document.addEventListener("click",function(e){if(e.target!==input&&!suggestBox.contains(e.target)){suggestBox.style.display="none";}});})();</script>
