<style>:root{--bg-navy:#02133e;--gold:#f1c232;}*{box-sizing:border-box;}body{margin:0;padding:0;background:var(--bg-navy);color:var(--gold);font-family:"Roboto","Sarabun",Arial,sans-serif;font-weight:300;-webkit-tap-highlight-color:transparent;}.page{max-width:900px;margin:0 auto;padding-bottom:40px;}.banner-wrap{width:100%;overflow:hidden;height:clamp(120px,26vw,300px);position:relative;}.banner-wrap img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block;}.banner-title-overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 12%;pointer-events:none;}.banner-title-overlay h1{margin:0;font-weight:400;}.topic-title-viet,.word-title-viet{font-size:clamp(15px,3vw,22px);font-weight:300;color:var(--gold);text-shadow:-1px -1px 0 #02133e,1px -1px 0 #02133e,-1px 1px 0 #02133e,1px 1px 0 #02133e,0 2px 6px rgba(0,0,0,0.6);margin:0;line-height:1.3;}.topic-title-thai,.word-title-thai{font-size:clamp(20px,4.2vw,38px);font-weight:400;color:var(--gold);text-shadow:-1px -1px 0 #02133e,1px -1px 0 #02133e,-1px 1px 0 #02133e,1px 1px 0 #02133e,0 2px 6px rgba(0,0,0,0.6);margin:4px 0 0 0;line-height:1.3;}.tv-loading-label{text-align:center;font-size:13px;line-height:1.4;opacity:0;padding:8px 20px 0 20px;transition:opacity 0.15s ease;}.tv-loading-label.active{opacity:0.75;}.container{padding:24px 20px;}.search-wrap{position:relative;margin-bottom:24px;}.search-input{width:100%;padding:12px 14px;background:rgba(241,194,50,0.08);border:1px solid rgba(241,194,50,0.4);border-radius:6px;color:var(--gold);font-family:"Roboto","Sarabun",Arial,sans-serif;font-weight:300;font-size:16px;outline:none;}.search-input::placeholder{color:rgba(241,194,50,0.5);}.search-suggest{display:none;position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--bg-navy);border:1px solid rgba(241,194,50,0.4);border-radius:6px;max-height:260px;overflow-y:auto;z-index:10;}.search-suggest .suggest-item{padding:10px 14px;cursor:pointer;font-size:15px;border-bottom:1px solid rgba(241,194,50,0.15);}.search-suggest .suggest-item:last-child{border-bottom:none;}.search-suggest .suggest-item:hover{background:rgba(241,194,50,0.12);}.tv-list{list-style:none;margin:0;padding:0;}.tv-list li{margin-bottom:14px;}.tv-list a{color:var(--gold);text-decoration:none;font-size:18px;display:block;padding:8px 0;border-bottom:1px solid rgba(241,194,50,0.2);}.tv-list a:hover{text-decoration:underline;}.tv-list-icon{margin-right:8px;}.empty-msg{opacity:0.7;font-size:15px;}.tv-toc{padding:0 0 20px 0;}.tv-toc-title{font-size:14px;opacity:0.75;margin-bottom:10px;letter-spacing:0.5px;}.tv-toc-item{display:block;color:var(--gold);text-decoration:none;font-size:15px;font-weight:300;padding:6px 0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}.tv-toc-item .icon{display:inline-block;margin-right:8px;}.faint-divider{width:100%;height:1px;background-color:var(--gold);opacity:0.4;}.tv-word-block{padding:24px 0;border-bottom:1px solid rgba(241,194,50,0.15);scroll-margin-top:16px;}.tv-word-block:last-child{border-bottom:none;}.detail-grid{display:grid;grid-template-columns:1fr;gap:28px;}@media (min-width:768px){.detail-grid{grid-template-columns:2fr 1fr;align-items:start;}}.detail-grid.single-col{grid-template-columns:1fr;}.detail-text{display:flex;flex-direction:column;gap:4px;}.detail-image img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;}.tv-heading-row{display:flex;align-items:center;gap:10px;margin:20px 0 8px 0;}.tv-heading-row h2,.tv-heading-row h3{margin:0;}.tv-word-h2{font-size:clamp(22px,5vw,30px);font-weight:400;margin:0;}.tv-word-viet-sub{opacity:0.85;font-size:clamp(14px,3.5vw,18px);margin:-6px 0 8px 0;}.detail-text h2{font-size:clamp(19px,4vw,26px);font-weight:400;}.detail-text h3{font-size:clamp(16px,3.4vw,20px);font-weight:400;opacity:0.95;}.detail-text p{margin:0 0 4px 0;opacity:0.95;line-height:1.6;}.detail-text ul,.detail-text ol{margin:0 0 10px 0;padding-left:22px;opacity:0.95;}.detail-text table{width:100%;border-collapse:collapse;margin:0 0 12px 0;}.detail-text td{padding:8px 10px;vertical-align:top;}.detail-text hr{border:none;border-top:1px solid rgba(241,194,50,0.3);margin:16px 0;}.viet-text{font-style:italic;}.loa-icon{width:28px;height:28px;flex:none;cursor:pointer;-webkit-user-select:none;user-select:none;transition:opacity 0.15s ease;}.loa-icon:hover{opacity:0.8;}.loa-icon.playing{opacity:0.55;}.loa-icon.loading{opacity:0.55;animation:tv-loa-breathe 1s ease-in-out infinite;}@keyframes tv-loa-breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}.back-button-wrap{display:flex;justify-content:center;padding:24px 20px 8px 20px;}.back-button-inner{position:relative;display:inline-block;width:60%;max-width:260px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}.back-button-inner img{width:100%;display:block;}.back-button-inner .back-button-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--gold);font-weight:300;font-size:clamp(13px,3.2vw,17px);white-space:nowrap;}.chat-fab{position:fixed;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:#0084FF;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,0.35);z-index:999;text-decoration:none;}.chat-fab svg{width:28px;height:28px;fill:#fff;}.chat-fab:hover{filter:brightness(1.08);}@media (max-width:600px){.chat-fab{right:12px;bottom:12px;width:50px;height:50px;}.chat-fab svg{width:25px;height:25px;}}</style>

<script>var tvTopics=[{"vi":"Hoạt động","url":"https://poltv.vn/tuvung/hoat-dong/"}];(function(){var input=document.getElementById("topicSearch");var suggestBox=document.getElementById("topicSuggest");input.addEventListener("input",function(){var q=input.value.trim().toLowerCase();suggestBox.innerHTML="";if(!q){suggestBox.style.display="none";return;}var matches=tvTopics.filter(function(it){return it.vi.toLowerCase().indexOf(q)===0;});if(matches.length===0){suggestBox.style.display="none";return;}matches.forEach(function(it){var el=document.createElement("div");el.className="suggest-item";el.textContent=it.vi;el.addEventListener("click",function(){window.top.location.href=it.url;});suggestBox.appendChild(el);});suggestBox.style.display="block";});document.addEventListener("click",function(e){if(e.target!==input&&!suggestBox.contains(e.target)){suggestBox.style.display="none";}});})();</script>
