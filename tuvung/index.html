<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Học Tiếng Thái: Từ Vựng Theo Chủ Đề - POLTV</title>
<meta name="description" content="Hàng nghìn từ vựng tiếng Thái theo chủ đề quen thuộc: gia đình, du lịch, ăn uống, công việc - có chữ Thái, cách đọc, nghĩa và ví dụ minh hoạ dễ nhớ, dễ áp dụng.">
<meta property="og:title" content="Học Tiếng Thái: Từ Vựng Theo Chủ Đề - POLTV">
<meta property="og:description" content="Hàng nghìn từ vựng tiếng Thái theo chủ đề quen thuộc: gia đình, du lịch, ăn uống, công việc - có chữ Thái, cách đọc, nghĩa và ví dụ minh hoạ dễ nhớ, dễ áp dụng.">
<meta property="og:image" content="https://drive.google.com/thumbnail?id=1zvLHrfmlo79pem-EPWFvygP_-pyOMLL7&sz=w1600">
<meta property="og:site_name" content="POLTV">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hoctiengthai.github.io/Poltv/tuvung/">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  :root {
    --bg-navy: #02133e;
    --gold: #f1c232;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ---------- Nav bar dùng chung toàn site POLTV ---------- */
  .site-nav { background: var(--bg-navy); border-bottom: 1px solid rgba(241, 194, 50, 0.25); }
  .site-nav-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .site-nav-logo { color: var(--gold); font-weight: 400; font-size: 18px; text-decoration: none; letter-spacing: 0.5px; flex: none; }
  .site-nav-links { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .site-nav-links a { color: var(--gold); text-decoration: none; font-size: 14px; font-weight: 300; opacity: 0.85; }
  .site-nav-links a:hover { opacity: 1; text-decoration: underline; }
  .site-nav-disabled { color: var(--gold); opacity: 0.4; font-size: 14px; font-weight: 300; cursor: not-allowed; white-space: nowrap; }
  .site-nav-disabled .badge { font-size: 10px; border: 1px solid rgba(241, 194, 50, 0.5); border-radius: 10px; padding: 1px 6px; margin-left: 4px; }
  body {
    background: var(--bg-navy);
    color: var(--gold);
    font-family: 'Roboto', Arial, sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }
  .page { max-width: 900px; margin: 0 auto; padding-bottom: 40px; }

  /* ---------- Banner (quy chuẩn chung) ---------- */
  .banner-wrap {
    width: 100%;
    overflow: hidden;
    height: clamp(120px, 26vw, 300px);
    position: relative;
  }
  .banner-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: center center; display: block; }
  .banner-title-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 12%;
    pointer-events: none;
  }
  /* Tầng 1 */
  .banner-title-overlay h1 {
    font-size: clamp(19px, 4vw, 36px);
    font-weight: 400;
    color: var(--gold);
    text-shadow: -1px -1px 0 #02133e, 1px -1px 0 #02133e, -1px 1px 0 #02133e, 1px 1px 0 #02133e, 0 2px 6px rgba(0,0,0,0.6);
    line-height: 1.3;
  }
  /* Tầng 2: Việt trên, Thái dưới (cỡ lớn hơn) */
  .topic-title-viet {
    font-size: clamp(15px, 3vw, 22px);
    font-weight: 300;
    color: var(--gold);
    text-shadow: -1px -1px 0 #02133e, 1px -1px 0 #02133e, -1px 1px 0 #02133e, 1px 1px 0 #02133e, 0 2px 6px rgba(0,0,0,0.6);
    margin: 0;
    line-height: 1.3;
  }
  .topic-title-thai {
    font-size: clamp(20px, 4.2vw, 38px);
    font-weight: 400;
    color: var(--gold);
    text-shadow: -1px -1px 0 #02133e, 1px -1px 0 #02133e, -1px 1px 0 #02133e, 1px 1px 0 #02133e, 0 2px 6px rgba(0,0,0,0.6);
    margin: 4px 0 0 0;
    line-height: 1.3;
  }
  /* Tầng 3: Thái trên (lớn), Việt dưới (nhỏ) */
  .banner-title-thai {
    font-size: clamp(19px, 3.8vw, 35px);
    font-weight: 400;
    color: var(--gold);
    text-shadow: -1px -1px 0 #02133e, 1px -1px 0 #02133e, -1px 1px 0 #02133e, 1px 1px 0 #02133e, 0 2px 6px rgba(0,0,0,0.6);
    margin: 0;
    line-height: 1.3;
  }
  .banner-title-viet {
    font-size: clamp(14px, 2.8vw, 23px);
    font-weight: 300;
    color: var(--gold);
    text-shadow: -1px -1px 0 #02133e, 1px -1px 0 #02133e, -1px 1px 0 #02133e, 1px 1px 0 #02133e, 0 2px 6px rgba(0,0,0,0.6);
    margin: 4px 0 0 0;
    line-height: 1.3;
    opacity: 0.92;
  }

  .container { padding: 24px 20px; }
  .empty-msg, .loading-msg { opacity: 0.7; font-size: 15px; }

  /* ---------- Ô tìm kiếm / gợi ý (Tầng 1 + Tầng 2) ---------- */
  .search-wrap { position: relative; margin-bottom: 24px; }
  .search-input {
    width: 100%;
    padding: 12px 14px;
    background: rgba(241, 194, 50, 0.08);
    border: 1px solid rgba(241, 194, 50, 0.4);
    border-radius: 6px;
    color: var(--gold);
    font-family: 'Roboto', Arial, sans-serif;
    font-weight: 300;
    font-size: 16px;
    outline: none;
  }
  .search-input::placeholder { color: rgba(241, 194, 50, 0.5); }
  .search-suggest {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    margin-top: 4px;
    background: var(--bg-navy);
    border: 1px solid rgba(241, 194, 50, 0.4);
    border-radius: 6px;
    max-height: 260px;
    overflow-y: auto;
    z-index: 10;
  }
  .search-suggest .suggest-item {
    padding: 10px 14px;
    cursor: pointer;
    font-size: 15px;
    border-bottom: 1px solid rgba(241, 194, 50, 0.15);
  }
  .search-suggest .suggest-item:last-child { border-bottom: none; }
  .search-suggest .suggest-item:hover { background: rgba(241, 194, 50, 0.12); }

  /* ---------- Tầng 1 + Tầng 2: danh sách chữ thuần ---------- */
  .topic-list, .word-list { list-style: none; }
  .topic-list li, .word-list li { margin-bottom: 14px; }
  .topic-list a, .word-list a {
    color: var(--gold);
    text-decoration: none;
    font-size: 18px;
    display: block;
    padding: 8px 0;
    border-bottom: 1px solid rgba(241, 194, 50, 0.2);
  }
  .topic-list a:hover, .word-list a:hover { text-decoration: underline; }
  .topic-icon, .word-icon { margin-right: 8px; }

  /* ---------- Tầng 3: layout riêng module Từ vựng - 2 cột desktop/tablet, xếp dọc mobile ---------- */
  .detail-grid { display: grid; grid-template-columns: 1fr; gap: 28px; padding: 28px 20px; }
  @media (min-width: 768px) {
    .detail-grid { grid-template-columns: 1.15fr 1fr; align-items: start; }
  }
  .detail-grid.single-col { grid-template-columns: 1fr; }
  .detail-text { display: flex; flex-direction: column; gap: 20px; }
  .detail-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .thai-text { font-size: clamp(24px, 6vw, 36px); font-weight: 400; color: var(--gold); line-height: 1.3; }
  .sub-row { font-size: clamp(14px, 3.5vw, 18px); color: var(--gold); opacity: 0.75; margin-top: -12px; }
  .example-text { font-size: clamp(17px, 4.2vw, 22px); color: var(--gold); line-height: 1.4; }
  .loa-icon {
    width: 28px;
    height: 28px;
    flex: none;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    transition: opacity 0.15s ease;
  }
  .loa-icon:hover { opacity: 0.8; }
  .loa-icon.playing { opacity: 0.55; }
  .loa-icon.loading { opacity: 0.55; animation: tv-loa-breathe 1s ease-in-out infinite; }
  @keyframes tv-loa-breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .detail-image img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 8px; }

  /* ---------- Nút Quay lại (quy chuẩn chung) ---------- */
  .back-button-wrap { display: flex; justify-content: center; padding: 24px 20px 8px 20px; text-decoration: none; }
  .back-button-inner { position: relative; display: inline-block; width: 60%; max-width: 260px; cursor: pointer; }
  .back-button-inner img { width: 100%; display: block; -webkit-user-select: none; user-select: none; }
  .back-button-inner .back-button-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--gold);
    font-family: 'Roboto', Arial, sans-serif;
    font-weight: 300;
    font-size: clamp(13px, 3.2vw, 17px);
    white-space: nowrap;
    pointer-events: none;
  }
</style>
</head>
<body>

  <nav class="site-nav">
    <div class="site-nav-inner">
      <a class="site-nav-logo" href="../">POLTV</a>
      <div class="site-nav-links">
        <a href="../">Trang chủ</a>
        <a href="../giaotrinh/">Tiếng Thái cơ bản</a>
        <a href="../tuvung/">Từ vựng</a>
        <a href="../#luyennghe">Luyện nghe</a>
        <span class="site-nav-disabled">Ngữ pháp<span class="badge">Sắp ra mắt</span></span>
      </div>
    </div>
  </nav>

  <div class="page" id="page">
    <div class="banner-wrap">
      <img id="bannerImg" alt="POLTV Banner">
      <div class="banner-title-overlay" id="bannerTitleOverlay">
        <h1>Học Tiếng Thái: Từ Vựng Theo Chủ Đề</h1>
      </div>
    </div>

    <div id="container">
      <div class="container"><p class="loading-msg">Đang tải dữ liệu...</p></div>
    </div>
  </div>

  <script>
    // ---------- Cấu hình - CHỈNH Ở ĐÂY nếu URL Web App hoặc link Sites đổi ----------
    var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzVEXk1be6TB4uCnRk7-0PwxiDR-sfseyLfWexYmkFfSc_4wFOIfm0HHnuDqa_0S2WV/exec';
    // Nút "Quay lại" ở Tầng 1 -> trang chủ Sites cố định (đúng SITES_URL của TUVUNG_CONFIG).
    var SITES_BACK_URL = 'https://hoctiengthai.github.io/Poltv/';
    var BANNER_IMAGE_URL = 'https://drive.google.com/thumbnail?id=1feCqjylbAPPPGbLIeX_alLy3DxiHFw9Z&sz=w1600';
    var BACK_BUTTON_IMAGE_URL = 'https://drive.google.com/thumbnail?id=1jM-w8ogp4eJpga1AdjFL_1VzGS61p-th&sz=w1600';

    document.getElementById('bannerImg').src = BANNER_IMAGE_URL;

    var pageEl = document.getElementById('page');
    var containerEl = document.getElementById('container');
    var bannerOverlayEl = document.getElementById('bannerTitleOverlay');

    var urlParams = new URLSearchParams(window.location.search);
    var wordCode = urlParams.get('word');
    var topicRaw = urlParams.get('topic');

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function appendBackButton(url) {
      var old = pageEl.querySelectorAll('.back-button-wrap');
      old.forEach(function (el) { el.remove(); });

      var a = document.createElement('a');
      a.className = 'back-button-wrap';
      a.href = url;
      a.style.textDecoration = 'none';
      a.innerHTML = '<div class="back-button-inner">' +
        '<img src="' + BACK_BUTTON_IMAGE_URL + '" alt="Quay lại">' +
        '<span class="back-button-text">Quay lại</span></div>';
      pageEl.appendChild(a);
    }

    function showError(message) {
      containerEl.innerHTML = '<div class="container"><p class="empty-msg">' + escapeHtml(message) + '</p></div>';
    }

    function fetchJson(url, onSuccess) {
      fetch(url)
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data && data.error) {
            showError(data.message || 'Đã có lỗi xảy ra. Vui lòng thử lại sau.');
            return;
          }
          onSuccess(data);
        })
        .catch(function () {
          showError('Không tải được dữ liệu (có thể do lỗi mạng hoặc CORS). Vui lòng thử lại sau.');
        });
    }

    function closeSuggestOnOutsideClick(inputEl, boxEl) {
      document.addEventListener('click', function (e) {
        if (e.target !== inputEl && !boxEl.contains(e.target)) {
          boxEl.style.display = 'none';
        }
      });
    }

    // ================= Tầng 1: danh sách Chủ đề =================
    function renderTopicList(data) {
      document.title = 'Học Tiếng Thái: Từ Vựng Theo Chủ Đề - POLTV';
      bannerOverlayEl.innerHTML = '<h1>Học Tiếng Thái: Từ Vựng Theo Chủ Đề</h1>';

      var topics = (data && data.topics) || [];
      var inner = document.createElement('div');
      inner.className = 'container';

      var searchWrap = document.createElement('div');
      searchWrap.className = 'search-wrap';
      searchWrap.innerHTML =
        '<input type="text" class="search-input" id="topicSearch" placeholder="Gõ tên chủ đề để tìm nhanh...">' +
        '<div class="search-suggest" id="topicSuggest"></div>';
      inner.appendChild(searchWrap);

      var listEl = document.createElement('ul');
      listEl.className = 'topic-list';

      function goToTopic(rawTopic) {
        window.location.href = 'index.html?topic=' + encodeURIComponent(rawTopic);
      }

      if (topics.length === 0) {
        listEl.innerHTML = '<li class="empty-msg">Chưa có chủ đề nào được đăng.</li>';
      } else {
        topics.forEach(function (item) {
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.href = 'index.html?topic=' + encodeURIComponent(item.raw);
          a.innerHTML = '<span class="topic-icon">📌</span>' + escapeHtml(item.vi);
          li.appendChild(a);
          listEl.appendChild(li);
        });
      }
      inner.appendChild(listEl);

      containerEl.innerHTML = '';
      containerEl.appendChild(inner);
      appendBackButton(SITES_BACK_URL);

      var searchInput = document.getElementById('topicSearch');
      var suggestBox = document.getElementById('topicSuggest');
      searchInput.addEventListener('input', function () {
        var q = searchInput.value.trim().toLowerCase();
        suggestBox.innerHTML = '';
        if (!q) { suggestBox.style.display = 'none'; return; }

        var matches = topics.filter(function (item) { return item.vi.toLowerCase().indexOf(q) === 0; });
        if (matches.length === 0) { suggestBox.style.display = 'none'; return; }

        matches.forEach(function (item) {
          var el = document.createElement('div');
          el.className = 'suggest-item';
          el.textContent = item.vi;
          el.addEventListener('click', function () { goToTopic(item.raw); });
          suggestBox.appendChild(el);
        });
        suggestBox.style.display = 'block';
      });
      closeSuggestOnOutsideClick(searchInput, suggestBox);
    }

    // ================= Tầng 2: danh sách Từ vựng trong 1 Chủ đề =================
    function renderWordList(data) {
      var vi = (data && data.topicVi) || '';
      var thai = (data && data.topicThai) || '';
      document.title = vi + ' - Từ vựng Tiếng Thái';

      bannerOverlayEl.innerHTML = '<p class="topic-title-viet"></p>';
      bannerOverlayEl.querySelector('.topic-title-viet').textContent = vi;
      if (thai) {
        var thaiEl = document.createElement('p');
        thaiEl.className = 'topic-title-thai';
        thaiEl.textContent = thai;
        bannerOverlayEl.appendChild(thaiEl);
      }

      var words = (data && data.words) || [];
      var inner = document.createElement('div');
      inner.className = 'container';

      var searchWrap = document.createElement('div');
      searchWrap.className = 'search-wrap';
      searchWrap.innerHTML =
        '<input type="text" class="search-input" id="wordSearch" placeholder="Gõ từ vựng để tìm nhanh...">' +
        '<div class="search-suggest" id="wordSuggest"></div>';
      inner.appendChild(searchWrap);

      var listEl = document.createElement('ul');
      listEl.className = 'word-list';

      function goToWord(code) {
        window.location.href = 'index.html?word=' + encodeURIComponent(code);
      }

      if (words.length === 0) {
        listEl.innerHTML = '<li class="empty-msg">Chưa có từ vựng nào trong chủ đề này.</li>';
      } else {
        words.forEach(function (item) {
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.href = 'index.html?word=' + encodeURIComponent(item.code);
          a.innerHTML = '<span class="word-icon">▸</span>' + escapeHtml(item.wordViet);
          li.appendChild(a);
          listEl.appendChild(li);
        });
      }
      inner.appendChild(listEl);

      containerEl.innerHTML = '';
      containerEl.appendChild(inner);
      appendBackButton('index.html');

      var searchInput = document.getElementById('wordSearch');
      var suggestBox = document.getElementById('wordSuggest');
      searchInput.addEventListener('input', function () {
        var q = searchInput.value.trim().toLowerCase();
        suggestBox.innerHTML = '';
        if (!q) { suggestBox.style.display = 'none'; return; }

        var matches = words.filter(function (item) { return item.wordViet.toLowerCase().indexOf(q) === 0; });
        if (matches.length === 0) { suggestBox.style.display = 'none'; return; }

        matches.forEach(function (item) {
          var div = document.createElement('div');
          div.className = 'suggest-item';
          div.textContent = item.wordViet;
          div.addEventListener('click', function () { goToWord(item.code); });
          suggestBox.appendChild(div);
        });
        suggestBox.style.display = 'block';
      });
      closeSuggestOnOutsideClick(searchInput, suggestBox);
    }

    // ================= Tầng 3: chi tiết 1 Từ vựng (port từ TuVung_WordDetail.html gốc) =================
    // Audio: 1 biến JS toàn cục dùng chung cho cả trang, y hệt bản gốc - bấm icon khác đang
    // phát -> dừng ngay audio cũ, phát audio mới từ đầu; bấm lại đúng icon đang phát -> không
    // có tác dụng, phải đợi phát xong.
    var tvCurrentAudio = null;
    var tvCurrentBtn = null;
    var tvIsLoading = false; // đang chờ fetch trả về cho 1 icon nào đó -> khoá thao tác với MỌI icon

    // url ở đây là link route ?action=streamAudio&id=... của Apps Script (trả JSON chứa
    // data URI base64), KHÔNG phải link Drive trực tiếp - phải fetch() rồi mới phát,
    // vì Apps Script không trả được Content-Type audio nhị phân thật sự (giới hạn nền tảng).
    function tvPlayAudio(url, btnEl) {
      if (!url) return;
      if (tvIsLoading) return; // đang tải icon nào đó (chưa xong) -> khoá hoàn toàn, không thao tác được icon nào cả
      if (tvCurrentBtn === btnEl) return; // đang phát đúng icon này -> không làm gì, đợi phát xong

      if (tvCurrentAudio) {
        tvCurrentAudio.pause();
        tvCurrentAudio.currentTime = 0;
      }
      if (tvCurrentBtn) tvCurrentBtn.classList.remove('playing', 'loading');
      tvCurrentAudio = null;
      tvCurrentBtn = btnEl;
      tvIsLoading = true;
      btnEl.classList.add('loading'); // báo hiệu ngay lúc bấm - đang tải audio

      fetch(url)
        .then(function (res) { return res.json(); })
        .then(function (data) {
          tvIsLoading = false;
          if (tvCurrentBtn !== btnEl) return; // an toàn dự phòng, bình thường không xảy ra vì đã khoá lúc loading
          if (!data || !data.success || !data.dataUri) {
            btnEl.classList.remove('loading');
            tvCurrentBtn = null;
            return;
          }
          tvCurrentAudio = new Audio(data.dataUri);
          btnEl.classList.remove('loading');
          btnEl.classList.add('playing');
          tvCurrentAudio.addEventListener('ended', function () {
            btnEl.classList.remove('playing');
            if (tvCurrentBtn === btnEl) tvCurrentBtn = null;
          });
          tvCurrentAudio.play();
        })
        .catch(function () {
          tvIsLoading = false;
          btnEl.classList.remove('loading');
          if (tvCurrentBtn === btnEl) tvCurrentBtn = null;
        });
    }

    function renderWordDetail(payload) {
      var detail = payload && payload.detail;
      var iconLoaUrl = payload && payload.iconLoaUrl;

      if (!payload || !payload.found || !detail) {
        bannerOverlayEl.innerHTML = '<h1>Học Tiếng Thái: Từ Vựng Theo Chủ Đề</h1>';
        showError('Từ vựng đang được cập nhật. Vui lòng quay lại sau.');
        appendBackButton('index.html');
        return;
      }

      document.title = (detail.wordViet || 'Từ vựng') + ' - POLTV';

      bannerOverlayEl.innerHTML =
        '<p class="banner-title-thai" id="titleThai"></p>' +
        '<p class="banner-title-viet" id="titleViet"></p>';
      document.getElementById('titleThai').textContent = detail.thai || '';
      document.getElementById('titleViet').textContent = detail.wordViet || '';

      containerEl.innerHTML =
        '<div class="detail-grid" id="detailGrid">' +
        '<div class="detail-text" id="detailText"></div>' +
        '<div class="detail-image" id="detailImage"></div>' +
        '</div>';

      var textEl = document.getElementById('detailText');
      var imageEl = document.getElementById('detailImage');
      var gridEl = document.getElementById('detailGrid');

      function makeLoaBtn(url) {
        var img = document.createElement('img');
        img.className = 'loa-icon';
        img.src = iconLoaUrl;
        img.alt = 'Phát âm';
        img.addEventListener('click', function () { tvPlayAudio(url, img); });
        return img;
      }

      // Cột trái: Tiếng Thái -> Giải nghĩa (nếu có) -> Ví dụ 1 -> Ví dụ 2
      var thaiRow = document.createElement('div');
      thaiRow.className = 'detail-row thai-row';
      var thaiText = document.createElement('span');
      thaiText.className = 'thai-text';
      thaiText.textContent = detail.thai || '';
      thaiRow.appendChild(thaiText);
      if (detail.audioWordUrl) thaiRow.appendChild(makeLoaBtn(detail.audioWordUrl));
      textEl.appendChild(thaiRow);

      if (detail.sub) {
        var subRow = document.createElement('div');
        subRow.className = 'detail-row sub-row';
        subRow.textContent = detail.sub;
        textEl.appendChild(subRow);
      }

      if (detail.example1) {
        var ex1Row = document.createElement('div');
        ex1Row.className = 'detail-row example-row';
        var ex1Text = document.createElement('span');
        ex1Text.className = 'example-text';
        ex1Text.textContent = detail.example1;
        ex1Row.appendChild(ex1Text);
        if (detail.audioExample1Url) ex1Row.appendChild(makeLoaBtn(detail.audioExample1Url));
        textEl.appendChild(ex1Row);
      }

      if (detail.example2) {
        var ex2Row = document.createElement('div');
        ex2Row.className = 'detail-row example-row';
        var ex2Text = document.createElement('span');
        ex2Text.className = 'example-text';
        ex2Text.textContent = detail.example2;
        ex2Row.appendChild(ex2Text);
        if (detail.audioExample2Url) ex2Row.appendChild(makeLoaBtn(detail.audioExample2Url));
        textEl.appendChild(ex2Row);
      }

      // Cột phải: ảnh minh hoạ 1:1 - không có thì bỏ hẳn cột, chuyển về 1 cột
      if (detail.imageUrl) {
        var img = document.createElement('img');
        img.src = detail.imageUrl;
        img.alt = detail.wordViet || detail.thai || '';
        imageEl.appendChild(img);
      } else {
        imageEl.remove();
        gridEl.classList.add('single-col');
      }

      // Nút Quay lại -> đúng Tầng 2 (Chủ đề) của từ này trên CHÍNH TRANG TĨNH này
      appendBackButton('index.html?topic=' + encodeURIComponent(detail.topic));
    }

    // ================= Điều hướng theo tham số trên URL của chính trang này =================
    if (wordCode) {
      fetchJson(APPS_SCRIPT_URL + '?word=' + encodeURIComponent(wordCode) + '&format=json', renderWordDetail);
    } else if (topicRaw) {
      fetchJson(APPS_SCRIPT_URL + '?module=tuvung&topic=' + encodeURIComponent(topicRaw) + '&format=json', renderWordList);
    } else {
      fetchJson(APPS_SCRIPT_URL + '?module=tuvung&format=json', renderTopicList);
    }
  </script>

</body>
</html>
