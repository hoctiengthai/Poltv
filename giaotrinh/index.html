<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Học Tiếng Thái Cơ Bản - Giáo Trình POLTV</title>
<meta name="description" content="Học tiếng Thái theo giáo trình chuẩn Bộ Giáo dục Thái Lan, biên soạn cho người Việt, lộ trình Lớp 1-6, giúp nắm vững phát âm, từ vựng, ngữ pháp, giao tiếp.">
<meta property="og:title" content="Học Tiếng Thái Cơ Bản - Giáo Trình POLTV">
<meta property="og:description" content="Học tiếng Thái theo giáo trình chuẩn Bộ Giáo dục Thái Lan, biên soạn cho người Việt, lộ trình Lớp 1-6, giúp nắm vững phát âm, từ vựng, ngữ pháp, giao tiếp.">
<meta property="og:image" content="https://drive.google.com/thumbnail?id=1fLwbfm-z6aNOQMKuxOuPF6Aw2aNapnTl&sz=w1600">
<meta property="og:site_name" content="POLTV">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hoctiengthai.github.io/Poltv/giaotrinh/">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  :root {
    --bg-navy: #02133e;
    --gold: #f1c232;
  }
  * { box-sizing: border-box; }

  /* ---------- Nav bar dùng chung toàn site POLTV ---------- */
  .site-nav { background: var(--bg-navy); border-bottom: 1px solid rgba(241, 194, 50, 0.25); }
  .site-nav-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .site-nav-logo { color: var(--gold); font-weight: 400; font-size: 18px; text-decoration: none; letter-spacing: 0.5px; flex: none; }
  .site-nav-links { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .site-nav-links a { color: var(--gold); text-decoration: none; font-size: 14px; font-weight: 300; opacity: 0.85; }
  .site-nav-links a:hover { opacity: 1; text-decoration: underline; }
  .site-nav-disabled { color: var(--gold); opacity: 0.4; font-size: 14px; font-weight: 300; cursor: not-allowed; white-space: nowrap; }
  .site-nav-disabled .badge { font-size: 10px; border: 1px solid rgba(241, 194, 50, 0.5); border-radius: 10px; padding: 1px 6px; margin-left: 4px; }
  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-navy);
    color: var(--gold);
    font-family: 'Roboto', Arial, sans-serif;
    font-weight: 300;
    -webkit-tap-highlight-color: transparent;
  }
  .page {
    max-width: 900px;
    margin: 0 auto;
    padding-bottom: 40px;
  }

  /* ---------- Banner + tiêu đề đè lên (quy chuẩn chung POLTV) ---------- */
  .banner-wrap {
    width: 100%;
    overflow: hidden;
    height: clamp(120px, 26vw, 300px);
    position: relative;
  }
  .banner-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    display: block;
  }
  .banner-title-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 12%;
    pointer-events: none;
  }
  /* Tầng 1 + Tầng 2: tiêu đề 1 khối <h1> */
  .banner-title-overlay h1 {
    font-size: clamp(21px, 4.2vw, 40px);
    font-weight: 400;
    color: var(--gold);
    text-shadow: -1px -1px 0 #02133e, 1px -1px 0 #02133e, -1px 1px 0 #02133e, 1px 1px 0 #02133e, 0 2px 6px rgba(0,0,0,0.6);
    line-height: 1.3;
  }
  /* Tầng 3: tiêu đề nhiều dòng (số bài / Thái / Việt / tên Phần) */
  .banner-lesson-number {
    font-size: clamp(13px, 2.6vw, 19px);
    font-weight: 300;
    color: var(--gold);
    text-shadow: -1px -1px 0 #02133e, 1px -1px 0 #02133e, -1px 1px 0 #02133e, 1px 1px 0 #02133e, 0 2px 6px rgba(0,0,0,0.6);
    margin: 0 0 4px 0;
    letter-spacing: 1px;
    opacity: 0.85;
  }
  .banner-title-thai {
    font-size: clamp(19px, 3.8vw, 35px);
    font-weight: 400;
    color: var(--gold);
    text-shadow: -1px -1px 0 #02133e, 1px -1px 0 #02133e, -1px 1px 0 #02133e, 1px 1px 0 #02133e, 0 2px 6px rgba(0,0,0,0.6);
    margin: 0;
    line-height: 1.3;
  }
  .banner-title-viet {
    font-size: clamp(14px, 2.8vw, 23px);
    font-weight: 300;
    color: var(--gold);
    text-shadow: -1px -1px 0 #02133e, 1px -1px 0 #02133e, -1px 1px 0 #02133e, 1px 1px 0 #02133e, 0 2px 6px rgba(0,0,0,0.6);
    margin: 4px 0 0 0;
    line-height: 1.3;
    opacity: 0.92;
  }
  .banner-section-label {
    font-size: clamp(10px, 1.6vw, 15px);
    font-weight: 300;
    color: var(--gold);
    text-shadow: -1px -1px 0 #02133e, 1px -1px 0 #02133e, -1px 1px 0 #02133e, 1px 1px 0 #02133e, 0 2px 6px rgba(0,0,0,0.6);
    margin-top: 6px;
    opacity: 0.85;
  }

  /* ---------- Vùng nội dung: có padding (Tầng 1+2), Tầng 3 tự quản lý riêng (full-width) ---------- */
  .container { padding: 24px 20px; }
  .empty-msg, .loading-msg { opacity: 0.7; font-size: 15px; }

  /* ---------- Tầng 1: lưới 6 Lớp ---------- */
  .class-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }
  .class-tile { display: block; text-decoration: none; }
  .class-tile .thumb-wrap {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 6px;
    overflow: hidden;
  }
  .class-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .class-tile .tile-label {
    display: block;
    margin-top: 8px;
    text-align: center;
    color: var(--gold);
    font-size: clamp(15px, 3.6vw, 20px);
    font-weight: 400;
  }

  /* ---------- Tầng 2: lưới Bài trong 1 Lớp ---------- */
  .lesson-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }
  .lesson-tile { display: block; text-decoration: none; cursor: pointer; }
  .lesson-tile .thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 6px;
    overflow: hidden;
  }
  .lesson-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lesson-tile .thumb-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(241, 194, 50, 0.12);
    font-size: clamp(28px, 8vw, 40px);
  }
  .lesson-tile .tile-label { display: block; margin-top: 8px; text-align: center; }
  .lesson-tile .tile-label .thai {
    display: block;
    color: var(--gold);
    font-size: clamp(16px, 4vw, 21px);
    font-weight: 400;
  }
  .lesson-tile .tile-label .viet {
    display: block;
    color: var(--gold);
    opacity: 0.85;
    font-size: clamp(13px, 3.2vw, 16px);
    font-weight: 300;
    margin-top: 2px;
  }

  /* ---------- Tầng 3: khối media (Video / Ảnh) - full-width, không viền ---------- */
  .media-block { width: 100%; margin-bottom: 10px; }
  .media-frame {
    width: 100%;
    position: relative;
    padding-top: 56.25%; /* tỷ lệ 16:9 */
    background-color: #000814;
    overflow: hidden;
  }
  .media-frame iframe,
  .media-frame img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    object-fit: cover;
  }
  .media-frame.is-playing { overflow: visible; min-height: 220px; }
  .media-frame img { -webkit-user-select: none; user-select: none; -webkit-user-drag: none; pointer-events: auto; }
  .image-guard { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 2; background: transparent; }
  .media-divider { width: 100%; height: 1px; background-color: var(--gold); opacity: 0.7; }

  .video-placeholder {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background-color: var(--bg-navy);
    background-size: cover;
    background-position: center;
  }
  .video-placeholder::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(2, 19, 62, 0.35);
  }
  .video-placeholder .play-icon {
    position: relative;
    z-index: 1;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(241, 194, 50, 0.15);
    border: 2px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .video-placeholder .play-icon::after {
    content: '';
    width: 0;
    height: 0;
    border-top: 14px solid transparent;
    border-bottom: 14px solid transparent;
    border-left: 22px solid var(--gold);
    margin-left: 6px;
  }

  /* ---------- Lightbox phóng to ảnh ---------- */
  .lightbox-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(2, 19, 62, 0.95);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 24px;
  }
  .lightbox-overlay.active { display: flex; }
  .lightbox-overlay img { max-width: 100%; max-height: 100%; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; }
  .lightbox-close { position: absolute; top: 16px; right: 20px; color: var(--gold); font-size: 32px; cursor: pointer; line-height: 1; }

  /* ---------- Mục lục các Phần ---------- */
  .section-toc { padding: 24px 20px 8px 20px; }
  .section-toc-title { font-size: 14px; opacity: 0.75; margin-bottom: 10px; letter-spacing: 0.5px; }
  .section-toc-item {
    display: block;
    color: var(--gold);
    text-decoration: none;
    font-size: 16px;
    font-weight: 300;
    padding: 10px 4px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .section-toc-item:hover { opacity: 0.7; }
  .section-toc-item.active { font-weight: 400; opacity: 1; }
  .section-toc-item .icon { display: inline-block; margin-right: 8px; }

  .content-empty-note { text-align: center; padding: 32px 20px; opacity: 0.7; font-size: 14px; }

  /* ---------- Nút Quay lại (quy chuẩn chung POLTV) ---------- */
  .back-button-wrap { display: flex; justify-content: center; padding: 24px 20px 8px 20px; text-decoration: none; }
  .back-button-inner { position: relative; display: inline-block; width: 60%; max-width: 260px; cursor: pointer; }
  .back-button-inner img { width: 100%; display: block; -webkit-user-select: none; user-select: none; }
  .back-button-inner .back-button-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--gold);
    font-family: 'Roboto', Arial, sans-serif;
    font-weight: 300;
    font-size: clamp(13px, 3.2vw, 17px);
    white-space: nowrap;
    pointer-events: none;
  }
</style>
</head>
<body>

  <nav class="site-nav">
    <div class="site-nav-inner">
      <a class="site-nav-logo" href="../">POLTV</a>
      <div class="site-nav-links">
        <a href="../">Trang chủ</a>
        <a href="../giaotrinh/">Tiếng Thái cơ bản</a>
        <a href="../tuvung/">Từ vựng</a>
        <a href="../#luyennghe">Luyện nghe</a>
        <span class="site-nav-disabled">Ngữ pháp<span class="badge">Sắp ra mắt</span></span>
      </div>
    </div>
  </nav>

  <div class="page" id="page">
    <div class="banner-wrap">
      <img id="bannerImg" alt="POLTV Banner">
      <div class="banner-title-overlay" id="bannerTitleOverlay">
        <h1>Học Tiếng Thái: Giáo Trình Cơ Bản Theo Lớp</h1>
      </div>
    </div>

    <div id="container">
      <div class="container"><p class="loading-msg">Đang tải dữ liệu...</p></div>
    </div>
  </div>

  <!-- Lightbox phóng to ảnh (chỉ dùng ở Tầng 3) -->
  <div class="lightbox-overlay" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img id="lightboxImg" src="" alt="">
  </div>

  <script>
    // ---------- Cấu hình - CHỈNH Ở ĐÂY nếu URL Web App hoặc link Sites đổi ----------
    // URL Web App production hiện tại (deployment đã "New version > Deploy", không đổi
    // qua các lần deploy version mới - chỉ đổi nếu tạo deployment HOÀN TOÀN MỚI).
    var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzVEXk1be6TB4uCnRk7-0PwxiDR-sfseyLfWexYmkFfSc_4wFOIfm0HHnuDqa_0S2WV/exec';
    // Nút "Quay lại" ở Tầng 1 -> trang chủ Sites cố định.
    var SITES_BACK_URL = 'https://sites.google.com/view/poltv-hoctiengthai/h%E1%BB%8Dc-ti%E1%BA%BFng-th%C3%A1i-c%C3%B9ng-poltv';
    // Ảnh banner + nút Quay lại (đúng 2 File ID cố định dùng chung toàn site POLTV).
    var BANNER_IMAGE_URL = 'https://drive.google.com/thumbnail?id=1feCqjylbAPPPGbLIeX_alLy3DxiHFw9Z&sz=w1600';
    var BACK_BUTTON_IMAGE_URL = 'https://drive.google.com/thumbnail?id=1jM-w8ogp4eJpga1AdjFL_1VzGS61p-th&sz=w1600';

    document.getElementById('bannerImg').src = BANNER_IMAGE_URL;

    var pageEl = document.getElementById('page');
    var containerEl = document.getElementById('container');
    var bannerOverlayEl = document.getElementById('bannerTitleOverlay');

    var urlParams = new URLSearchParams(window.location.search);
    var lessonCode = urlParams.get('lesson');
    var className = urlParams.get('class');

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function clearBackButtons() {
      var old = pageEl.querySelectorAll('.back-button-wrap');
      old.forEach(function (el) { el.remove(); });
    }

    function appendBackButton(url) {
      clearBackButtons();
      var a = document.createElement('a');
      a.className = 'back-button-wrap';
      a.href = url;
      a.style.textDecoration = 'none';
      a.innerHTML = '<div class="back-button-inner">' +
        '<img src="' + BACK_BUTTON_IMAGE_URL + '" alt="Quay lại">' +
        '<span class="back-button-text">Quay lại</span></div>';
      pageEl.appendChild(a);
    }

    function showError(message) {
      containerEl.innerHTML = '<div class="container"><p class="empty-msg">' + escapeHtml(message) + '</p></div>';
    }

    function fetchJson(url, onSuccess) {
      fetch(url)
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data && data.error) {
            showError(data.message || 'Đã có lỗi xảy ra. Vui lòng thử lại sau.');
            return;
          }
          onSuccess(data);
        })
        .catch(function () {
          showError('Không tải được dữ liệu (có thể do lỗi mạng hoặc CORS). Vui lòng thử lại sau.');
        });
    }

    // ================= Tầng 1: danh sách 6 Lớp =================
    function renderClassList(data) {
      document.title = 'Học Tiếng Thái Cơ Bản - Giáo Trình POLTV';
      bannerOverlayEl.innerHTML = '<h1>Học Tiếng Thái: Giáo Trình Cơ Bản Theo Lớp</h1>';

      var classes = (data && data.classes) || [];
      var inner = document.createElement('div');
      inner.className = 'container';

      if (classes.length === 0) {
        inner.innerHTML = '<p class="empty-msg">Chưa có lớp học nào.</p>';
      } else {
        var gridEl = document.createElement('div');
        gridEl.className = 'class-grid';
        classes.forEach(function (item) {
          var a = document.createElement('a');
          a.className = 'class-tile';
          a.href = 'index.html?class=' + encodeURIComponent(item.name);

          var thumbWrap = document.createElement('div');
          thumbWrap.className = 'thumb-wrap';
          var img = document.createElement('img');
          img.src = item.imageUrl;
          img.alt = item.name;
          thumbWrap.appendChild(img);
          a.appendChild(thumbWrap);

          var label = document.createElement('span');
          label.className = 'tile-label';
          label.textContent = item.name;
          a.appendChild(label);

          gridEl.appendChild(a);
        });
        inner.appendChild(gridEl);
      }

      containerEl.innerHTML = '';
      containerEl.appendChild(inner);
      appendBackButton(SITES_BACK_URL);
    }

    // ================= Tầng 2: danh sách Bài trong 1 Lớp =================
    function renderLessonList(data) {
      var cls = (data && data.class) || '';
      document.title = cls + ' - Giáo trình POLTV';
      bannerOverlayEl.innerHTML = '<h1>Giáo trình Tiếng Thái<br>' + escapeHtml(cls) + '</h1>';

      var lessons = (data && data.lessons) || [];
      var inner = document.createElement('div');
      inner.className = 'container';

      if (lessons.length === 0) {
        inner.innerHTML = '<p class="empty-msg">Chưa có bài nào trong lớp này.</p>';
      } else {
        var gridEl = document.createElement('div');
        gridEl.className = 'lesson-grid';
        lessons.forEach(function (item) {
          var a = document.createElement('a');
          a.className = 'lesson-tile';
          a.href = 'index.html?lesson=' + encodeURIComponent(item.lessonCode);

          var thumbWrap = document.createElement('div');
          thumbWrap.className = 'thumb-wrap';
          if (item.coverImageUrl) {
            var img = document.createElement('img');
            img.src = item.coverImageUrl;
            img.alt = 'Bài ' + item.lessonNumber;
            thumbWrap.appendChild(img);
          } else {
            var placeholder = document.createElement('div');
            placeholder.className = 'thumb-placeholder';
            placeholder.textContent = '📘';
            thumbWrap.appendChild(placeholder);
          }
          a.appendChild(thumbWrap);

          var label = document.createElement('span');
          label.className = 'tile-label';

          var thaiLine = document.createElement('span');
          thaiLine.className = 'thai';
          thaiLine.textContent = 'บทที่ ' + item.lessonNumber + (item.nameThai ? (' ' + item.nameThai) : '');
          label.appendChild(thaiLine);

          var vietLine = document.createElement('span');
          vietLine.className = 'viet';
          vietLine.textContent = 'Bài ' + item.lessonNumber + (item.nameViet ? (': ' + item.nameViet) : '');
          label.appendChild(vietLine);

          a.appendChild(label);
          gridEl.appendChild(a);
        });
        inner.appendChild(gridEl);
      }

      containerEl.innerHTML = '';
      containerEl.appendChild(inner);
      appendBackButton('index.html');
    }

    // ================= Tầng 3: chi tiết 1 Bài (port từ LessonViewer.html gốc) =================
    var LESSON_DATA = null;
    var currentSectionIndex = 0;

    function renderLessonDetail(data) {
      if (!data || !data.found) {
        bannerOverlayEl.innerHTML = '<h1>Học Tiếng Thái: Giáo Trình Cơ Bản Theo Lớp</h1>';
        showError('Bài học đang được cập nhật. Vui lòng quay lại sau.');
        appendBackButton('index.html');
        return;
      }

      LESSON_DATA = data;
      // Nút Quay lại của bản tĩnh này luôn trỏ về đúng Tầng 2 CỦA CHÍNH TRANG TĨNH -
      // KHÔNG dùng LESSON_DATA.backUrl trả từ API (trỏ về Apps Script/Google Sites).
      LESSON_DATA.staticBackUrl = 'index.html?class=' + encodeURIComponent(LESSON_DATA.className);

      document.title = (LESSON_DATA.nameViet || 'Bài học') + ' - POLTV';

      bannerOverlayEl.innerHTML =
        '<p class="banner-lesson-number" id="lessonNumberLabel"></p>' +
        '<p class="banner-title-thai" id="titleThai"></p>' +
        '<p class="banner-title-viet" id="titleViet"></p>' +
        '<p class="banner-section-label" id="sectionLabel"></p>';

      // Tầng 3 hiển thị media FULL-WIDTH, không có padding .container bao ngoài
      // (đúng quy chuẩn chung: "Video/ảnh: không viền, full chiều ngang")
      containerEl.innerHTML =
        '<div id="mediaContainer"></div>' +
        '<div class="section-toc" id="sectionToc" style="display:none;">' +
        '<div class="section-toc-title">Nội dung bài học</div>' +
        '<div id="sectionTocList"></div></div>';

      renderSection(0);
      appendBackButton(LESSON_DATA.staticBackUrl);
    }

    function renderSection(index) {
      var section = LESSON_DATA.sections[index];
      if (!section) return;
      currentSectionIndex = index;

      document.getElementById('lessonNumberLabel').textContent = LESSON_DATA.lessonNumber ? ('Bài ' + LESSON_DATA.lessonNumber) : '';
      document.getElementById('titleThai').textContent = LESSON_DATA.nameThai;
      document.getElementById('titleViet').textContent = LESSON_DATA.nameViet;
      document.getElementById('sectionLabel').textContent = section.label || '';

      var mediaContainer = document.getElementById('mediaContainer');
      mediaContainer.innerHTML = '';

      if (section.media.length === 0) {
        var emptyNote = document.createElement('div');
        emptyNote.className = 'content-empty-note';
        emptyNote.textContent = 'Nội dung đang được cập nhật.';
        mediaContainer.appendChild(emptyNote);
      } else {
        section.media.forEach(function (item) {
          mediaContainer.appendChild(buildMediaBlock(item));
        });
      }

      renderToc();

      if (LESSON_DATA.hasMultipleSections) {
        var url = new URL(window.location.href);
        url.searchParams.set('phan', index + 1);
        window.history.pushState({ sectionIndex: index }, '', url.toString());
      }

      window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
    }

    function buildMediaBlock(item) {
      var block = document.createElement('div');
      block.className = 'media-block';

      var frame = document.createElement('div');
      frame.className = 'media-frame';

      if (item.type === 'VIDEO') {
        var placeholder = document.createElement('div');
        placeholder.className = 'video-placeholder';
        if (item.thumbnailUrl) {
          placeholder.style.backgroundImage = 'url(' + item.thumbnailUrl + ')';
        }
        var playIcon = document.createElement('div');
        playIcon.className = 'play-icon';
        placeholder.appendChild(playIcon);

        placeholder.addEventListener('click', function () {
          // Trên điện thoại: mở trang xem trực tiếp của Drive (đúng y hệt bản Apps Script gốc).
          // Trên máy tính: nhúng gọn trong trang.
          var isMobile = window.innerWidth < 768;

          if (isMobile) {
            window.top.location.href = item.viewUrl;
            return;
          }

          var width = frame.clientWidth;
          var height = Math.round(width * 9 / 16);

          var wrapper = document.createElement('div');
          wrapper.style.cssText = 'width:100%;height:' + height + 'px;background:#000814;overflow:hidden;';

          var iframe = document.createElement('iframe');
          iframe.src = item.embedUrl;
          iframe.setAttribute('allow', 'autoplay');
          iframe.setAttribute('allowfullscreen', 'true');
          iframe.style.cssText = 'width:100%;height:100%;border:none;display:block;';

          wrapper.appendChild(iframe);
          frame.replaceWith(wrapper);
        });

        frame.appendChild(placeholder);
      } else {
        // IMAGE
        var img = document.createElement('img');
        img.src = item.embedUrl;
        img.loading = 'lazy';
        img.draggable = false;
        img.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        img.addEventListener('click', function () { openLightbox(item.embedUrl); });

        var guard = document.createElement('div');
        guard.className = 'image-guard';
        guard.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        guard.addEventListener('click', function () { openLightbox(item.embedUrl); });

        frame.appendChild(img);
        frame.appendChild(guard);
      }

      block.appendChild(frame);

      var divider = document.createElement('div');
      divider.className = 'media-divider';
      block.appendChild(divider);

      return block;
    }

    function renderToc() {
      var tocWrap = document.getElementById('sectionToc');
      var tocList = document.getElementById('sectionTocList');
      tocList.innerHTML = '';

      if (!LESSON_DATA.hasMultipleSections) {
        tocWrap.style.display = 'none';
        return;
      }

      tocWrap.style.display = 'block';

      LESSON_DATA.sections.forEach(function (section, i) {
        var item = document.createElement('a');
        item.className = 'section-toc-item' + (i === currentSectionIndex ? ' active' : '');
        item.innerHTML = '<span class="icon">▸</span>' + section.label;
        item.addEventListener('click', function () {
          renderSection(i);
        });
        tocList.appendChild(item);
      });
    }

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.getElementById('lightboxImg').src = '';
    }

    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.getElementById('lightbox').addEventListener('click', function (e) {
      if (e.target.id === 'lightbox') closeLightbox();
    });

    // Hỗ trợ nút Back của trình duyệt/điện thoại khi đang xem nhiều Phần trong Tầng 3
    window.addEventListener('popstate', function (e) {
      if (!LESSON_DATA) return;
      if (e.state && typeof e.state.sectionIndex === 'number') {
        renderSection(e.state.sectionIndex);
      } else {
        renderSection(0);
      }
    });

    // ================= Điều hướng theo tham số trên URL của chính trang này =================
    if (lessonCode) {
      fetchJson(APPS_SCRIPT_URL + '?lesson=' + encodeURIComponent(lessonCode) + '&format=json', renderLessonDetail);
    } else if (className) {
      fetchJson(APPS_SCRIPT_URL + '?module=giaotrinh&class=' + encodeURIComponent(className) + '&format=json', renderLessonList);
    } else {
      fetchJson(APPS_SCRIPT_URL + '?module=giaotrinh&format=json', renderClassList);
    }
  </script>

</body>
