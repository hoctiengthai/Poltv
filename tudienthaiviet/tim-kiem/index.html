<script>var tdEntries=[];fetch("https://poltv.vn/tudienthaiviet/search-index.json").then(function(r){return r.json();}).then(function(d){tdEntries=d;}).catch(function(e){console.error("Tải chỉ mục tìm kiếm Từ điển thất bại",e);});(function(){var input=document.getElementById("tdSearch");var suggestBox=document.getElementById("tdSuggest");var tvWordCharRe=/[A-Za-z\u00C0-\u024F\u1E00-\u1EFF]/;function tvIsBoundary(ch){return !ch||!tvWordCharRe.test(ch);}function tvFindAllIdx(t,s){var idxs=[];var pos=0;while(true){var i=t.indexOf(s,pos);if(i===-1)break;idxs.push(i);pos=i+1;}return idxs;}function tvHasWholeWord(t,w){var occ=tvFindAllIdx(t,w);for(var i=0;i<occ.length;i++){var idx=occ[i];var before=idx>0?t.charAt(idx-1):"";var after=(idx+w.length)<t.length?t.charAt(idx+w.length):"";if(tvIsBoundary(before)&&tvIsBoundary(after))return idx;}return -1;}function tvBestRank(t,q){var idx=tvHasWholeWord(t,q);return idx===-1?null:{rank:idx===0?0:1,key:idx};}function tvRunSearch(){var q=input.value.trim().toLowerCase();suggestBox.innerHTML="";if(!q){suggestBox.style.display="none";return;}var qWords=q.split(/\s+/).filter(function(w){return w.length>0;});var matches=tdEntries.map(function(it){var t=it.search.toLowerCase();var r=tvBestRank(t,q);if(r)return {it:it,rank:r.rank,key:r.key};var allWordsFound=qWords.length>0&&qWords.every(function(w){return tvHasWholeWord(t,w)!==-1;});if(allWordsFound)return {it:it,rank:2,key:tvHasWholeWord(t,qWords[0])};return null;}).filter(function(m){return m!==null;});matches.sort(function(a,b){return a.rank-b.rank||a.key-b.key;});if(matches.length>20)matches=matches.slice(0,20);if(matches.length===0){suggestBox.style.display="none";return;}matches.forEach(function(m){var it=m.it;var el=document.createElement("div");el.className="suggest-item";el.textContent=it.label;el.addEventListener("click",function(){var u=it.url;suggestBox.style.display="none";if(u.charAt(0)==="#"&&window.poltvJumpToAnchor){var id=u.slice(1);var vv=window.visualViewport;var done=false;function jumpNow(){if(done)return;done=true;if(vv)vv.removeEventListener("resize",jumpNow);window.poltvJumpToAnchor(id);}if(vv)vv.addEventListener("resize",jumpNow);setTimeout(jumpNow,350);input.blur();}else{window.top.location.href=u;}});suggestBox.appendChild(el);});suggestBox.style.display="block";}input.addEventListener("input",tvRunSearch);input.addEventListener("focus",tvRunSearch);document.addEventListener("click",function(e){if(e.target!==input&&!suggestBox.contains(e.target)){suggestBox.style.display="none";}});})();(function(){var input=document.getElementById("tdSearch");if(!input)return;input.addEventListener("keydown",function(e){if(e.key!=="Enter")return;e.preventDefault();var q=input.value.trim();if(!q)return;window.top.location.href="https://poltv.vn/tudienthaiviet/tim-kiem/?q="+encodeURIComponent(q);});})();(function(){var input=document.getElementById("tdSearch");if(!input)return;var btn=document.getElementById("tdSearchClear");if(!btn)return;function tdSyncClearBtn(){btn.style.display=input.value?"block":"none";}input.addEventListener("input",tdSyncClearBtn);input.addEventListener("focus",tdSyncClearBtn);tdSyncClearBtn();btn.addEventListener("click",function(){input.value="";input.dispatchEvent(new Event("input"));tdSyncClearBtn();input.focus();});})();function tdScrollToSearch(){window.scrollTo(0,0);var el=document.getElementById("tdSearch");if(el)el.focus();}(function(){var titleEl=document.getElementById("tdResultsTitle");var listEl=document.getElementById("tdResultsList");if(!titleEl||!listEl)return;var q=(new URLSearchParams(window.location.search).get("q")||"").trim();var input=document.getElementById("tdSearch");if(input&&q){input.value=q;var clearBtn=document.getElementById("tdSearchClear");if(clearBtn)clearBtn.style.display="block";}if(!q){titleEl.textContent="Gõ 1 từ vào ô tìm kiếm rồi bấm Enter để xem đầy đủ mọi chỗ có từ đó trong từ điển.";return;}var bannerTitleEl=document.getElementById("tdBannerTitle");if(bannerTitleEl)bannerTitleEl.textContent=q;document.title=q+" - Kết quả tìm kiếm | Từ điển Thái - Việt | POLTV";titleEl.textContent="Kết quả cho “"+q+"”";function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;}function words(s){return s.toLowerCase().split(/\s+/).filter(function(w){return w.length>0;});}var ql=q.toLowerCase();var qWords=words(q);var tdWordCharRe=/[A-Za-z\u00C0-\u024F\u1E00-\u1EFF]/;function tdIsBoundary(ch){return !ch||!tdWordCharRe.test(ch);}function tdFindAllIdx(t,s){var idxs=[];var pos=0;while(true){var i=t.indexOf(s,pos);if(i===-1)break;idxs.push(i);pos=i+1;}return idxs;}function tdHasWholeWord(t,w){var occ=tdFindAllIdx(t,w);for(var i=0;i<occ.length;i++){var idx=occ[i];var before=idx>0?t.charAt(idx-1):"";var after=(idx+w.length)<t.length?t.charAt(idx+w.length):"";if(tdIsBoundary(before)&&tdIsBoundary(after))return idx;}return -1;}function rankOf(text){if(!text)return null;var lower=text.toLowerCase();var idx=tdHasWholeWord(lower,ql);if(idx!==-1)return idx===0?0:1;return qWords.length>0&&qWords.every(function(w){return tdHasWholeWord(lower,w)!==-1;})?2:null;}function findRanges(text){var lower=text.toLowerCase();var ranges=[];var idx=tdHasWholeWord(lower,ql);if(idx!==-1){ranges.push([idx,idx+ql.length]);return ranges;}qWords.forEach(function(w){var i=tdHasWholeWord(lower,w);if(i!==-1)ranges.push([i,i+w.length]);});return ranges;}function highlight(text){if(!text)return "";var ranges=findRanges(text);if(ranges.length===0)return esc(text);ranges.sort(function(a,b){return a[0]-b[0];});var merged=[];ranges.forEach(function(r){var last=merged[merged.length-1];if(last&&r[0]<=last[1]){last[1]=Math.max(last[1],r[1]);}else{merged.push(r.slice());}});var out="";var pos=0;merged.forEach(function(r){out+=esc(text.slice(pos,r[0]));out+='<span class="td-hit">'+esc(text.slice(r[0],r[1]))+"</span>";pos=r[1];});out+=esc(text.slice(pos));return out;}fetch("https://poltv.vn/tudienthaiviet/search-detail.json").then(function(r){return r.json();}).then(function(items){var results=[];items.forEach(function(it){if(it.kind==="name"){var r1=rankOf(it.headword);if(r1!==null)results.push({tier:1,rank:r1,item:it});}else if(it.kind==="gloss"){var r2=rankOf(it.text);if(r2!==null)results.push({tier:1,rank:r2,item:it});}else{var rt=rankOf(it.thai);var rv=rankOf(it.viet);var best=rt===null?rv:(rv===null?rt:Math.min(rt,rv));if(best!==null)results.push({tier:2,rank:best,item:it});}});if(results.length===0){listEl.innerHTML='<p class="empty-msg">Không tìm thấy chỗ nào có “'+esc(q)+'” trong từ điển.</p>';return;}results.sort(function(a,b){return a.tier-b.tier||a.rank-b.rank;});var html="";results.forEach(function(r){var it=r.item;html+='<a class="td-hit-row" href="'+esc(it.url)+'">';if(it.kind==="name"){html+="<b>"+highlight(it.headword)+"</b>";}else if(it.kind==="gloss"){html+="<b>"+esc(it.headword)+"</b> — "+highlight(it.text);}else{html+='<span class="td-hit-headword">'+esc(it.headword)+"</span> "+highlight(it.thai)+" ‑ "+highlight(it.viet);}html+="</a>";});listEl.innerHTML=html;}).catch(function(e){listEl.innerHTML='<p class="empty-msg">Không tải được dữ liệu tra cứu.</p>';console.error("Tải dữ liệu tìm kiếm tổng hợp Từ điển thất bại",e);});})();</script>
