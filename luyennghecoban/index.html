<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Luyện nghe Tiếng Thái cơ bản - POLTV</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  :root {
    --bg-navy: #02133e;
    --gold: #f1c232;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-navy);
    color: var(--gold);
    font-family: 'Roboto', Arial, sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }
  .page {
    max-width: 900px;
    margin: 0 auto;
    padding-bottom: 40px;
  }

  /* ---------- Banner + tiêu đề đè lên (quy chuẩn chung POLTV) ---------- */
  .banner-wrap {
    width: 100%;
    overflow: hidden;
    height: clamp(120px, 26vw, 300px);
    position: relative;
  }
  .banner-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    display: block;
  }
  .banner-title-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 12%;
    pointer-events: none;
  }
  .banner-title-overlay h1 {
    font-size: clamp(21px, 4.2vw, 40px);
    font-weight: 400;
    color: var(--gold);
    text-shadow: -1px -1px 0 #02133e, 1px -1px 0 #02133e, -1px 1px 0 #02133e, 1px 1px 0 #02133e, 0 2px 6px rgba(0,0,0,0.6);
    line-height: 1.3;
  }

  .container { padding: 24px 20px; }
  .empty-msg, .loading-msg { opacity: 0.7; font-size: 15px; grid-column: 1 / -1; }

  /* ---------- Tầng 1: lưới 6 Lớp ---------- */
  .class-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }
  .class-tile { display: block; text-decoration: none; }
  .class-tile .thumb-wrap {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 6px;
    overflow: hidden;
  }
  .class-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .class-tile .tile-label {
    display: block;
    margin-top: 8px;
    text-align: center;
    color: var(--gold);
    font-size: clamp(15px, 3.6vw, 20px);
    font-weight: 400;
  }

  /* ---------- Tầng 2: lưới Bài trong 1 Lớp - bấm vào redirect thẳng sang link Drive /view ---------- */
  .lesson-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }
  .lesson-tile { display: block; text-decoration: none; cursor: pointer; }
  .lesson-tile .thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 6px;
    overflow: hidden;
  }
  .lesson-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lesson-tile .play-badge {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: clamp(44px, 14vw, 60px);
    height: clamp(44px, 14vw, 60px);
    border-radius: 50%;
    background: rgba(2, 19, 62, 0.55);
    border: 2px solid rgba(241, 194, 50, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(20px, 6vw, 28px);
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    pointer-events: none;
  }
  .lesson-tile .tile-label {
    display: block;
    margin-top: 8px;
    text-align: center;
    color: var(--gold);
    font-size: clamp(14px, 3.4vw, 18px);
    font-weight: 400;
  }

  /* ---------- Nút Quay lại (quy chuẩn chung POLTV) ---------- */
  .back-button-wrap { display: flex; justify-content: center; padding: 24px 20px 8px 20px; text-decoration: none; }
  .back-button-inner { position: relative; display: inline-block; width: 60%; max-width: 260px; cursor: pointer; }
  .back-button-inner img { width: 100%; display: block; -webkit-user-select: none; user-select: none; }
  .back-button-inner .back-button-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--gold);
    font-family: 'Roboto', Arial, sans-serif;
    font-weight: 300;
    font-size: clamp(13px, 3.2vw, 17px);
    white-space: nowrap;
    pointer-events: none;
  }
</style>
</head>
<body>

  <div class="page" id="page">
    <div class="banner-wrap">
      <img id="bannerImg" alt="POLTV Banner">
      <div class="banner-title-overlay" id="bannerTitleOverlay">
        <h1>Luyện nghe Tiếng Thái cơ bản</h1>
      </div>
    </div>

    <div class="container" id="container">
      <p class="loading-msg">Đang tải dữ liệu...</p>
    </div>
  </div>

  <script>
    // ---------- Cấu hình - CHỈNH Ở ĐÂY nếu URL Web App hoặc link Sites đổi ----------
    var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzVEXk1be6TB4uCnRk7-0PwxiDR-sfseyLfWexYmkFfSc_4wFOIfm0HHnuDqa_0S2WV/exec';
    // Nút "Quay lại" ở Tầng 1 -> trang Luyện nghe cố định trên Google Sites.
    var SITES_BACK_URL = 'https://sites.google.com/view/poltv-hoctiengthai/h%E1%BB%8Dc-ti%E1%BA%BFng-th%C3%A1i-c%C3%B9ng-poltv/luy%E1%BB%87n-nghe-ti%E1%BA%BFng-th%C3%A1i';
    // Ảnh banner + nút Quay lại (đúng 2 File ID cố định dùng chung toàn site POLTV).
    var BANNER_IMAGE_URL = 'https://drive.google.com/thumbnail?id=1feCqjylbAPPPGbLIeX_alLy3DxiHFw9Z&sz=w1600';
    var BACK_BUTTON_IMAGE_URL = 'https://drive.google.com/thumbnail?id=1jM-w8ogp4eJpga1AdjFL_1VzGS61p-th&sz=w1600';

    document.getElementById('bannerImg').src = BANNER_IMAGE_URL;

    var pageEl = document.getElementById('page');
    var containerEl = document.getElementById('container');
    var bannerTitleEl = document.querySelector('#bannerTitleOverlay h1');

    var urlParams = new URLSearchParams(window.location.search);
    var className = urlParams.get('lop');

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function appendBackButton(url) {
      var old = pageEl.querySelectorAll('.back-button-wrap');
      old.forEach(function (el) { el.remove(); });

      var a = document.createElement('a');
      a.className = 'back-button-wrap';
      a.href = url;
      a.style.textDecoration = 'none';
      a.innerHTML = '<div class="back-button-inner">' +
        '<img src="' + BACK_BUTTON_IMAGE_URL + '" alt="Quay lại">' +
        '<span class="back-button-text">Quay lại</span></div>';
      pageEl.appendChild(a);
    }

    function showError(message) {
      containerEl.innerHTML = '<p class="empty-msg">' + escapeHtml(message) + '</p>';
    }

    function fetchJson(url, onSuccess) {
      fetch(url)
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data && data.error) {
            showError(data.message || 'Đã có lỗi xảy ra. Vui lòng thử lại sau.');
            return;
          }
          onSuccess(data);
        })
        .catch(function () {
          showError('Không tải được dữ liệu (có thể do lỗi mạng hoặc CORS). Vui lòng thử lại sau.');
        });
    }

    // ================= Tầng 1: danh sách 6 Lớp =================
    function renderClassList(data) {
      document.title = 'Luyện nghe Tiếng Thái cơ bản - POLTV';
      bannerTitleEl.textContent = 'Luyện nghe Tiếng Thái cơ bản';

      var classes = (data && data.classes) || [];
      if (classes.length === 0) {
        containerEl.innerHTML = '<p class="empty-msg">Chưa có lớp học nào.</p>';
      } else {
        var gridEl = document.createElement('div');
        gridEl.className = 'class-grid';
        classes.forEach(function (item) {
          var a = document.createElement('a');
          a.className = 'class-tile';
          a.href = 'index.html?lop=' + encodeURIComponent(item.name);

          var thumbWrap = document.createElement('div');
          thumbWrap.className = 'thumb-wrap';
          var img = document.createElement('img');
          img.src = item.imageUrl;
          img.alt = item.name;
          thumbWrap.appendChild(img);
          a.appendChild(thumbWrap);

          var label = document.createElement('span');
          label.className = 'tile-label';
          label.textContent = item.name;
          a.appendChild(label);

          gridEl.appendChild(a);
        });
        containerEl.innerHTML = '';
        containerEl.appendChild(gridEl);
      }

      appendBackButton(SITES_BACK_URL);
    }

    // ================= Tầng 2: danh sách Bài trong 1 Lớp =================
    // Bấm vào 1 bài -> redirect THẲNG sang link Drive /view (audioViewUrl), y hệt bản gốc:
    // không có trang phát riêng, không phân biệt mobile/desktop.
    function renderLessonList(data) {
      var cls = (data && data.class) || '';
      document.title = cls + ' - Luyện nghe Tiếng Thái cơ bản';
      bannerTitleEl.textContent = cls;

      var lessons = (data && data.lessons) || [];
      if (lessons.length === 0) {
        containerEl.innerHTML = '<p class="empty-msg">Chưa có bài nào trong lớp này.</p>';
      } else {
        var gridEl = document.createElement('div');
        gridEl.className = 'lesson-grid';
        lessons.forEach(function (item) {
          var a = document.createElement('a');
          a.className = 'lesson-tile';
          a.href = item.audioViewUrl;

          var thumbWrap = document.createElement('div');
          thumbWrap.className = 'thumb-wrap';
          var img = document.createElement('img');
          img.src = item.coverImageUrl;
          img.alt = 'Bài ' + item.lessonNo;
          thumbWrap.appendChild(img);
          var playBadge = document.createElement('span');
          playBadge.className = 'play-badge';
          playBadge.textContent = '🔊';
          thumbWrap.appendChild(playBadge);
          a.appendChild(thumbWrap);

          var label = document.createElement('span');
          label.className = 'tile-label';
          label.textContent = 'Bài ' + item.lessonNo;
          a.appendChild(label);

          gridEl.appendChild(a);
        });
        containerEl.innerHTML = '';
        containerEl.appendChild(gridEl);
      }

      appendBackButton('index.html');
    }

    // ================= Điều hướng theo tham số trên URL của chính trang này =================
    if (className) {
      fetchJson(APPS_SCRIPT_URL + '?module=luyennghe_coban&lop=' + encodeURIComponent(className) + '&format=json', renderLessonList);
    } else {
      fetchJson(APPS_SCRIPT_URL + '?module=luyennghe_coban&format=json', renderClassList);
    }
  </script>

</body>
</html>
