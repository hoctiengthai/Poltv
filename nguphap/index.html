<style>:root{--bg-navy:#02133e;--gold:#f1c232;}*{box-sizing:border-box;}body{margin:0;padding:0;background:var(--bg-navy);color:var(--gold);font-family:"Roboto","Sarabun",Arial,sans-serif;font-weight:300;-webkit-tap-highlight-color:transparent;}.page{max-width:900px;margin:0 auto;padding-bottom:40px;}.banner-wrap{width:100%;overflow:hidden;height:clamp(120px,26vw,300px);position:relative;}.banner-wrap img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block;}.banner-title-overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 12%;pointer-events:none;}.banner-title-overlay h1{margin:0;font-weight:400;font-size:clamp(21px,4.2vw,40px);color:var(--gold);text-shadow:-1px -1px 0 #02133e,1px -1px 0 #02133e,-1px 1px 0 #02133e,1px 1px 0 #02133e,0 2px 6px rgba(0,0,0,0.6);line-height:1.35;}.container{padding:24px 20px;}.np-list{list-style:none;margin:0;padding:0;}.np-list li{margin-bottom:14px;}.np-list a{color:var(--gold);text-decoration:none;font-size:18px;display:block;padding:8px 0;border-bottom:1px solid rgba(241,194,50,0.2);}.np-list a:hover{text-decoration:underline;}.np-list-icon{margin-right:8px;}.empty-msg{opacity:0.7;font-size:15px;padding:0 20px;}.media-block{width:100%;margin-top:16px;margin-bottom:10px;}.media-frame{width:100%;position:relative;padding-top:56.25%;background-color:#000814;overflow:hidden;}.media-frame iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;display:block;}.media-frame.is-playing{overflow:visible;min-height:220px;}.video-placeholder{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;cursor:pointer;background-color:#02133e;background-size:cover;background-position:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}.video-placeholder::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(2,19,62,0.35);}.video-placeholder .play-icon{position:relative;z-index:1;width:64px;height:64px;border-radius:50%;background:rgba(241,194,50,0.15);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;}.video-placeholder .play-icon::after{content:"";width:0;height:0;border-top:14px solid transparent;border-bottom:14px solid transparent;border-left:22px solid var(--gold);margin-left:6px;}.media-divider{width:100%;height:1px;background-color:var(--gold);opacity:0.7;}.lesson-content{padding:8px 20px 0 20px;line-height:1.7;}.lesson-content h2{font-size:clamp(19px,4vw,26px);font-weight:400;margin:28px 0 12px 0;}.lesson-content h3{font-size:clamp(16px,3.4vw,20px);font-weight:400;margin:20px 0 10px 0;opacity:0.95;}.lesson-content h4{font-size:clamp(14px,3vw,17px);font-weight:400;margin:16px 0 8px 0;opacity:0.9;}.lesson-content p{margin:0 0 12px 0;opacity:0.95;}.lesson-content ul,.lesson-content ol{margin:0 0 12px 0;padding-left:22px;opacity:0.95;}.lesson-content li{margin-bottom:4px;}.lesson-content table{width:100%;border-collapse:collapse;margin:0 0 16px 0;}.lesson-content td{padding:8px 10px;vertical-align:top;}.lesson-content a{color:var(--gold);}.lesson-content hr{border:none;border-top:1px solid rgba(241,194,50,0.3);margin:20px 0;}.viet-text{font-style:italic;}.back-button-wrap{display:flex;justify-content:center;padding:24px 20px 8px 20px;}.back-button-inner{position:relative;display:inline-block;width:60%;max-width:260px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}.back-button-inner img{width:100%;display:block;}.back-button-inner .back-button-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--gold);font-weight:300;font-size:clamp(13px,3.2vw,17px);white-space:nowrap;}</style>
