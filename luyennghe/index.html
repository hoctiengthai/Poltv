<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Học Tiếng Thái: Luyện Nghe Theo Chủ Đề - POLTV</title>
<meta name="description" content="Rèn kỹ năng nghe hiểu tiếng Thái theo chủ đề cùng NongYak trên POLTV, hội thoại thực tế giọng bản xứ, có phiên âm và dịch nghĩa, phù hợp người mới bắt đầu.">
<meta property="og:title" content="Học Tiếng Thái: Luyện Nghe Theo Chủ Đề - POLTV">
<meta property="og:description" content="Rèn kỹ năng nghe hiểu tiếng Thái theo chủ đề cùng NongYak trên POLTV, hội thoại thực tế giọng bản xứ, có phiên âm và dịch nghĩa, phù hợp người mới bắt đầu.">
<meta property="og:image" content="https://drive.google.com/thumbnail?id=1DZzHsUARjy7pkpdA-RZJ8MdqnO49qoBb&sz=w1600">
<meta property="og:site_name" content="POLTV">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thuanhaidang-eng.github.io/hoctiengthai-Poltv/luyennghe/">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  :root {
    --bg-navy: #02133e;
    --gold: #f1c232;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ---------- Nav bar dùng chung toàn site POLTV ---------- */
  .site-nav { background: var(--bg-navy); border-bottom: 1px solid rgba(241, 194, 50, 0.25); }
  .site-nav-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .site-nav-logo { color: var(--gold); font-weight: 400; font-size: 18px; text-decoration: none; letter-spacing: 0.5px; flex: none; }
  .site-nav-links { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .site-nav-links a { color: var(--gold); text-decoration: none; font-size: 14px; font-weight: 300; opacity: 0.85; }
  .site-nav-links a:hover { opacity: 1; text-decoration: underline; }
  .site-nav-disabled { color: var(--gold); opacity: 0.4; font-size: 14px; font-weight: 300; cursor: not-allowed; white-space: nowrap; }
  .site-nav-disabled .badge { font-size: 10px; border: 1px solid rgba(241, 194, 50, 0.5); border-radius: 10px; padding: 1px 6px; margin-left: 4px; }
  body {
    background: var(--bg-navy);
    color: var(--gold);
    font-family: 'Roboto', Arial, sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }
  .page {
    max-width: 900px;
    margin: 0 auto;
    padding-bottom: 40px;
  }

  /* ---------- Banner + tiêu đề đè lên (quy chuẩn chung POLTV) ---------- */
  .banner-wrap {
    width: 100%;
    overflow: hidden;
    height: clamp(120px, 26vw, 300px);
    position: relative;
  }
  .banner-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    display: block;
  }
  .banner-title-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 12%;
    pointer-events: none;
  }
  .banner-title-overlay h1 {
    font-size: clamp(21px, 4.2vw, 40px);
    font-weight: 400;
    color: var(--gold);
    text-shadow: -1px -1px 0 #02133e, 1px -1px 0 #02133e, -1px 1px 0 #02133e, 1px 1px 0 #02133e, 0 2px 6px rgba(0,0,0,0.6);
    line-height: 1.3;
  }

  .container { padding: 24px 20px; }

  /* ---------- Tầng 1 + Tầng 2: danh sách Chủ đề / danh sách Câu ---------- */
  .topic-list, .sentence-list { list-style: none; }
  .topic-list li, .sentence-list li { margin-bottom: 14px; }
  .topic-list a, .sentence-list a {
    color: var(--gold);
    text-decoration: none;
    font-size: 17px;
    display: block;
    padding: 8px 0;
    border-bottom: 1px solid rgba(241, 194, 50, 0.2);
  }
  .topic-list a:hover, .sentence-list a:hover { text-decoration: underline; }
  .topic-icon, .sentence-icon { margin-right: 8px; }

  /* ---------- Tầng 3: chi tiết 1 bài (video Shorts + câu + từ vựng) ---------- */
  .video-shorts-wrap {
    width: 100%;
    max-width: 340px;
    margin: 0 auto 6px auto;
  }
  .video-shorts-frame {
    position: relative;
    width: 100%;
    padding-top: 177.78%;
    overflow: hidden;
    background-color: #000814;
  }
  .video-shorts-frame iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
  }
  .divider {
    border: none;
    border-top: 1px solid var(--gold);
    opacity: 0.7;
    margin: 20px 0;
  }
  .cau-thai {
    font-size: 26px;
    color: var(--gold);
    margin-bottom: 24px;
    line-height: 1.5;
    font-weight: 400;
  }
  .vocab-title { font-size: 17px; margin-bottom: 10px; color: var(--gold); }
  .vocab-list { list-style: none; }
  .vocab-list li {
    margin-bottom: 8px;
    padding-left: 16px;
    position: relative;
    font-size: 15px;
    line-height: 1.5;
  }
  .vocab-list li::before { content: "▪"; position: absolute; left: 0; }
  .vocab-tu { font-size: 18px; font-weight: 400; }

  .empty-msg, .loading-msg { opacity: 0.7; font-size: 15px; }

  /* ---------- Nút Quay lại (quy chuẩn chung POLTV) ---------- */
  .back-button-wrap {
    display: flex;
    justify-content: center;
    padding: 24px 20px 8px 20px;
    text-decoration: none;
  }
  .back-button-inner {
    position: relative;
    display: inline-block;
    width: 60%;
    max-width: 260px;
    cursor: pointer;
  }
  .back-button-inner img {
    width: 100%;
    display: block;
    -webkit-user-select: none;
    user-select: none;
  }
  .back-button-inner .back-button-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--gold);
    font-family: 'Roboto', Arial, sans-serif;
    font-weight: 300;
    font-size: clamp(13px, 3.2vw, 17px);
    white-space: nowrap;
    pointer-events: none;
  }
</style>
</head>
<body>

  <nav class="site-nav">
    <div class="site-nav-inner">
      <a class="site-nav-logo" href="../">POLTV</a>
      <div class="site-nav-links">
        <a href="../">Trang chủ</a>
        <a href="../giaotrinh/">Tiếng Thái cơ bản</a>
        <a href="../tuvung/">Từ vựng</a>
        <a href="../#luyennghe">Luyện nghe</a>
        <span class="site-nav-disabled">Ngữ pháp<span class="badge">Sắp ra mắt</span></span>
      </div>
    </div>
  </nav>

  <div class="page" id="page">
    <div class="banner-wrap">
      <img id="bannerImg" alt="POLTV Banner">
      <div class="banner-title-overlay">
        <h1 id="bannerTitle">Học Tiếng Thái: Luyện Nghe Theo Chủ Đề Cùng NongYak</h1>
      </div>
    </div>

    <div class="container" id="container">
      <p class="loading-msg">Đang tải dữ liệu...</p>
    </div>
  </div>

  <script>
    // ---------- Cấu hình - CHỈNH Ở ĐÂY nếu URL Web App hoặc link Sites đổi ----------
    // URL Web App production hiện tại (deployment đã "New version > Deploy", không đổi
    // qua các lần deploy version mới - chỉ đổi nếu tạo deployment HOÀN TOÀN MỚI).
    var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzVEXk1be6TB4uCnRk7-0PwxiDR-sfseyLfWexYmkFfSc_4wFOIfm0HHnuDqa_0S2WV/exec';
    // Nút "Quay lại" ở Tầng 1 -> trang Luyện nghe cố định trên Google Sites.
    var SITES_BACK_URL = 'https://sites.google.com/view/poltv-hoctiengthai/h%E1%BB%8Dc-ti%E1%BA%BFng-th%C3%A1i-c%C3%B9ng-poltv/luy%E1%BB%87n-nghe-ti%E1%BA%BFng-th%C3%A1i';
    // Ảnh banner + nút Quay lại (đúng 2 File ID cố định đang dùng chung toàn site POLTV).
    var BANNER_IMAGE_URL = 'https://drive.google.com/thumbnail?id=1feCqjylbAPPPGbLIeX_alLy3DxiHFw9Z&sz=w1600';
    var BACK_BUTTON_IMAGE_URL = 'https://drive.google.com/thumbnail?id=1jM-w8ogp4eJpga1AdjFL_1VzGS61p-th&sz=w1600';

    document.getElementById('bannerImg').src = BANNER_IMAGE_URL;

    var pageEl = document.getElementById('page');
    var containerEl = document.getElementById('container');
    var bannerTitleEl = document.getElementById('bannerTitle');

    var urlParams = new URLSearchParams(window.location.search);
    var sentenceCode = urlParams.get('sentence');
    var topicName = urlParams.get('topic');

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function appendBackButton(url) {
      var a = document.createElement('a');
      a.className = 'back-button-wrap';
      a.href = url;
      a.style.textDecoration = 'none';
      a.innerHTML = '<div class="back-button-inner">' +
        '<img src="' + BACK_BUTTON_IMAGE_URL + '" alt="Quay lại">' +
        '<span class="back-button-text">Quay lại</span></div>';
      pageEl.appendChild(a);
    }

    function showError(message) {
      containerEl.innerHTML = '<p class="empty-msg">' + escapeHtml(message) + '</p>';
    }

    function buildApiUrl(extraQuery) {
      return APPS_SCRIPT_URL + '?module=luyennghe_nongyak&format=json' + (extraQuery || '');
    }

    function fetchJson(url, onSuccess) {
      fetch(url)
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data && data.error) {
            showError(data.message || 'Đã có lỗi xảy ra. Vui lòng thử lại sau.');
            return;
          }
          onSuccess(data);
        })
        .catch(function () {
          showError('Không tải được dữ liệu (có thể do lỗi mạng hoặc CORS). Vui lòng thử lại sau.');
        });
    }

    function renderTopicList(data) {
      document.title = 'Học Tiếng Thái: Luyện Nghe Theo Chủ Đề - POLTV';
      bannerTitleEl.textContent = 'Học Tiếng Thái: Luyện Nghe Theo Chủ Đề Cùng NongYak';

      var topics = (data && data.topics) || [];
      if (topics.length === 0) {
        containerEl.innerHTML = '<p class="empty-msg">Chưa có chủ đề nào được đăng.</p>';
      } else {
        var html = '<ul class="topic-list">';
        topics.forEach(function (t) {
          html += '<li><a href="index.html?topic=' + encodeURIComponent(t) + '">' +
            '<span class="topic-icon">📌</span>' + escapeHtml(t) + '</a></li>';
        });
        html += '</ul>';
        containerEl.innerHTML = html;
      }
      appendBackButton(SITES_BACK_URL);
    }

    function renderSentenceList(data) {
      var topic = (data && data.topic) || '';
      document.title = topic + ' - Luyện nghe cùng NongYak';
      bannerTitleEl.textContent = topic;

      var sentences = (data && data.sentences) || [];
      if (sentences.length === 0) {
        containerEl.innerHTML = '<p class="empty-msg">Chưa có câu nào trong chủ đề này.</p>';
      } else {
        var html = '<ul class="sentence-list">';
        sentences.forEach(function (item) {
          html += '<li><a href="index.html?sentence=' + encodeURIComponent(item.maBaiHoc) + '">' +
            '<span class="sentence-icon">💬</span>' + escapeHtml(item.cauViet) + '</a></li>';
        });
        html += '</ul>';
        containerEl.innerHTML = html;
      }
      appendBackButton('index.html');
    }

    function renderDetail(data) {
      var lesson = data && data.lesson;
      if (!lesson || !lesson.found) {
        bannerTitleEl.textContent = 'Học Tiếng Thái: Luyện Nghe Theo Chủ Đề Cùng NongYak';
        showError('Bài học đang được cập nhật. Vui lòng quay lại sau.');
        appendBackButton('index.html');
        return;
      }

      document.title = (lesson.cauViet || 'Luyện nghe cùng NongYak') + ' - POLTV';
      bannerTitleEl.textContent = lesson.cauViet || '';

      var html = '';
      if (lesson.youtubeEmbedUrl) {
        html += '<div class="video-shorts-wrap"><div class="video-shorts-frame">' +
          '<iframe src="' + lesson.youtubeEmbedUrl + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>' +
          '</div></div>';
        html += '<hr class="divider">';
      }

      html += '<div class="cau-thai">' + escapeHtml(lesson.cauThai) + '</div>';
      html += '<div class="vocab-title">Từ vựng:</div>';
      if (lesson.vocab && lesson.vocab.length > 0) {
        html += '<ul class="vocab-list">';
        lesson.vocab.forEach(function (v) {
          html += '<li><span class="vocab-tu">' + escapeHtml(v.tu) + '</span> = ' + escapeHtml(v.nghia) + '</li>';
        });
        html += '</ul>';
      } else {
        html += '<p class="empty-msg">Chưa có từ vựng.</p>';
      }

      containerEl.innerHTML = html;
      appendBackButton('index.html?topic=' + encodeURIComponent(lesson.topic));
    }

    // ---------- Điều hướng theo tham số trên URL của chính trang này ----------
    if (sentenceCode) {
      fetchJson(buildApiUrl('&sentence=' + encodeURIComponent(sentenceCode)), renderDetail);
    } else if (topicName) {
      fetchJson(buildApiUrl('&topic=' + encodeURIComponent(topicName)), renderSentenceList);
    } else {
      fetchJson(buildApiUrl(''), renderTopicList);
    }
  </script>

</body>
</html>
