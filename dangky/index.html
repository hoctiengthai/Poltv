<body>
<div class="page" role="main">

  <div class="banner-wrap">
    <img src="https://drive.google.com/thumbnail?id=1Ko8ggQkqp65vWAWXe6YVPGSikAJcELbs&sz=w1600" alt="POLTV Banner">
    <div class="banner-title-overlay"><h1>Đăng ký học tiếng Thái</h1></div>
  </div>

  <div class="container">

    <div id="buoc1">
      <p class="step-title"><b>Bước 1</b> - Chọn gói học</p>
      <div id="goiGrid"><div class="empty-msg">Đang tải danh sách gói...</div></div>
    </div>

    <div id="buoc2" class="form-wrap">
      <p class="step-title"><b>Bước 2</b> - Thông tin của bạn</p>
      <p class="goi-dang-chon">Gói đã chọn: <b id="tenGoiDangChon"></b></p>

      <div class="form-field">
        <label for="inputHoTen">Họ tên</label>
        <input type="text" id="inputHoTen" placeholder="Nhập họ tên của bạn">
      </div>
      <div class="form-field">
        <label for="inputEmail">Email *</label>
        <input type="email" id="inputEmail" placeholder="Dùng để nhận thông báo kích hoạt" required>
      </div>
      <div class="form-field">
        <label for="inputMaGioiThieu">Mã giới thiệu (nếu có)</label>
        <input type="text" id="inputMaGioiThieu" placeholder="VD: POLTV1234">
      </div>

      <button class="submit-btn" id="nutDangKy" onclick="dangKy()">Đăng ký ngay</button>
      <p class="form-error" id="formError"></p>
    </div>

    <div id="buoc3" class="result-wrap"></div>

  </div>

  <a class="back-button-wrap" href="https://poltv.vn/">
    <div class="back-button-inner">
      <img src="https://poltv.vn/assets/interface/back-button.webp" alt="Quay lại">
    </div>
  </a>
</div>

<a class="chat-fab" href="https://m.me/Poltvchannel" target="_blank" rel="noopener" aria-label="Chat với POLTV qua Messenger"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 3C6.48 3 2 6.94 2 11.7c0 2.6 1.36 4.93 3.5 6.5V22l3.9-2.1c.83.2 1.7.3 2.6.3 5.52 0 10-3.94 10-8.7C22 6.94 17.52 3 12 3z"/></svg></a>

<script>
  const API_BASE_URL = 'https://script.google.com/macros/s/AKfycbx0zDBbIOZRRmKoqdh3GCEVyvi07vCZL9z2i3yOfC0yZ9G6tbmqnFuLz1c1MfqP7yG5/exec';
  const NGAN_HANG_BIN = '970432';
  const NGAN_HANG_SO_TK = 'AGBSPIGZT913JW';
  const NGAN_HANG_TEN_CHU_TK = 'DANG THUAN HAI';

  let demJsonp = 0;
  function goiJsonp(action, thamSoThem) {
    return new Promise(function (resolve, reject) {
      demJsonp++;
      const tenCallback = 'jsonp_cb_' + Date.now() + '_' + demJsonp;
      const u = new URL(API_BASE_URL);
      u.searchParams.set('action', action);
      if (thamSoThem) {
        Object.keys(thamSoThem).forEach(function (k) { u.searchParams.set(k, thamSoThem[k]); });
      }
      u.searchParams.set('callback', tenCallback);

      const script = document.createElement('script');
      let xong = false;

      const donDep = function () {
        delete window[tenCallback];
        if (script.parentNode) script.parentNode.removeChild(script);
        clearTimeout(hetGio);
      };

      window[tenCallback] = function (duLieu) {
        xong = true;
        donDep();
        resolve(duLieu);
      };

      script.onerror = function () {
        if (xong) return;
        donDep();
        reject(new Error('Không tải được API (mạng lỗi).'));
      };

      const hetGio = setTimeout(function () {
        if (xong) return;
        donDep();
        reject(new Error('Hết thời gian chờ phản hồi (20 giây), vui lòng thử lại.'));
      }, 20000);

      script.src = u.toString();
      document.head.appendChild(script);
    });
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = (text === null || text === undefined) ? '' : text.toString();
    return div.innerHTML;
  }

  function dinhDangTien(so) {
    return Number(so).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') + 'đ';
  }

  let goiDaChon = null;
  let danhSachGoiHienTai = [];

  function taiDanhSachGoi() {
    goiJsonp('danhSachGoi')
      .then(function (ketQua) {
        if (!ketQua.ok) {
          document.getElementById('goiGrid').innerHTML = '<div class="empty-msg">Không tải được danh sách gói, vui lòng tải lại trang.</div>';
          return;
        }
        hienThiDanhSachGoi(ketQua.goi || []);
      })
      .catch(function () {
        document.getElementById('goiGrid').innerHTML = '<div class="empty-msg">Không tải được danh sách gói, vui lòng tải lại trang.</div>';
      });
  }

  function hienThiDanhSachGoi(danhSach) {
    danhSachGoiHienTai = danhSach;
    const grid = document.getElementById('goiGrid');
    if (danhSach.length === 0) {
      grid.innerHTML = '<div class="empty-msg">Hiện chưa có gói nào mở đăng ký.</div>';
      return;
    }

    const anhChung = danhSach.map(function (g) { return g.anhUrl; }).filter(function (u) { return u; })[0];
    const bannerHtml = anhChung
      ? '<div class="goi-banner"><img src="' + escapeHtml(anhChung) + '" alt="Các gói học POLTV"></div>'
      : '';
    const huongDanHtml = '<p class="huong-dan-text">Chọn 1 gói phù hợp bên dưới, điền thông tin của bạn ở Bước 2, và nhận mã QR thanh toán ngay trên trang này - không cần chờ email. Sau khi chuyển khoản, tài khoản của bạn sẽ được kích hoạt trong thời gian sớm nhất.</p>';

    let listHtml = '<div class="goi-list">';
    danhSach.forEach(function (g, idx) {
      const giaHtml = g.laFree
        ? '<span class="goi-item-mota">' + escapeHtml(g.moTa) + '</span>'
        : '<span class="goi-item-gia">' + dinhDangTien(g.gia) + '</span>';
      listHtml += '<button type="button" class="goi-item" id="goi-' + idx + '" onclick="chonGoi(' + idx + ')">' +
        '<span class="goi-item-ten">' + escapeHtml(g.ten) + '</span>' + giaHtml +
        '</button>';
    });
    listHtml += '</div>';

    grid.innerHTML = bannerHtml + huongDanHtml + listHtml;
  }

  function chonGoi(idx) {
    const g = danhSachGoiHienTai[idx];
    goiDaChon = g;
    document.querySelectorAll('.goi-item').forEach(function (c) { c.classList.remove('selected'); });
    document.getElementById('goi-' + idx).classList.add('selected');

    document.getElementById('tenGoiDangChon').textContent = g.ten;
    document.getElementById('buoc2').classList.add('show');
    document.getElementById('buoc2').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  (function dienSanMaGioiThieu() {
    const thamSo = new URLSearchParams(window.location.search);
    const ref = thamSo.get('ref');
    if (ref) document.getElementById('inputMaGioiThieu').value = ref;
  })();

  function dangKy() {
    const email = document.getElementById('inputEmail').value.trim();
    const hoTen = document.getElementById('inputHoTen').value.trim();
    const maGioiThieu = document.getElementById('inputMaGioiThieu').value.trim();
    const loiEl = document.getElementById('formError');

    if (!goiDaChon) {
      loiEl.textContent = 'Vui lòng chọn 1 gói học ở Bước 1.';
      loiEl.classList.add('show');
      return;
    }
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      loiEl.textContent = 'Vui lòng nhập đúng định dạng email.';
      loiEl.classList.add('show');
      return;
    }
    loiEl.classList.remove('show');

    const nut = document.getElementById('nutDangKy');
    nut.disabled = true;
    nut.textContent = 'Đang xử lý...';

    goiJsonp('dangKyHocVien', { email: email, hoTen: hoTen, goiDangKy: goiDaChon.ten, maGioiThieu: maGioiThieu })
      .then(function (ketQua) {
        hienThiKetQua(ketQua);
      })
      .catch(function (loi) {
        nut.disabled = false;
        nut.textContent = 'Đăng ký ngay';
        loiEl.textContent = loi.message;
        loiEl.classList.add('show');
      });
  }

  function hienThiKetQua(ketQua) {
    document.getElementById('buoc1').style.display = 'none';
    document.getElementById('buoc2').classList.remove('show');

    const buoc3 = document.getElementById('buoc3');
    buoc3.classList.add('show');

    if (ketQua.ok && ketQua.loai === 'qr') {
      const urlQR = 'https://img.vietqr.io/image/' + NGAN_HANG_BIN + '-' + NGAN_HANG_SO_TK + '-compact2.png'
        + '?amount=' + ketQua.soTien
        + '&addInfo=' + encodeURIComponent(ketQua.maThanhToan)
        + '&accountName=' + encodeURIComponent(NGAN_HANG_TEN_CHU_TK);

      buoc3.innerHTML =
        '<p class="result-title">Quét mã QR để thanh toán</p>' +
        '<img class="qr-img" src="' + urlQR + '" alt="Mã QR thanh toán">' +
        '<div class="qr-info">' +
          'Gói: <b>' + escapeHtml(ketQua.goiDangKy) + '</b><br>' +
          'Số tiền: <b>' + dinhDangTien(ketQua.soTien) + '</b><br>' +
          'Mã thanh toán: <span class="ma-thanh-toan">' + escapeHtml(ketQua.maThanhToan) + '</span>' +
        '</div>' +
        '<div class="luu-y-box">' +
          '<b>Lưu ý:</b> nếu app ngân hàng không tự điền được theo QR, chuyển khoản thủ công đúng số tiền và <b>bắt buộc ghi đúng mã thanh toán ở trên</b> vào nội dung chuyển khoản. ' +
          'Hoàn tất thanh toán trong vòng <b>24 giờ</b>, quá hạn cần đăng ký lại. Hệ thống tự động kích hoạt ngay sau khi nhận được thanh toán.' +
        '</div>';
      return;
    }

    if (ketQua.ok && ketQua.loai === 'free') {
      buoc3.innerHTML =
        '<p class="result-title">🎉 Kích hoạt thành công!</p>' +
        '<p>Tài khoản của bạn đã được kích hoạt ngay, vui lòng kiểm tra email để xem link truy cập bài học.</p>';
      return;
    }

    buoc3.innerHTML =
      '<p class="result-title">Không hoàn tất được đăng ký</p>' +
      '<p class="result-error">' + escapeHtml(ketQua.loi || 'Có lỗi xảy ra, vui lòng thử lại.') + '</p>' +
      '<button class="thu-lai-btn" onclick="location.reload()">Thử lại</button>';
  }

  taiDanhSachGoi();
</script>
</body>
</html>
